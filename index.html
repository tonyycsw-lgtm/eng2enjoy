<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小學英文練習</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', 'Microsoft JhengHei', sans-serif;
        }
        
        body {
            background-color: #f8f9fa;
            color: #333;
            line-height: 1.6;
            padding: 20px;
            font-size: 18px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background-color: white;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }
        
        header {
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
            padding: 30px 40px;
            text-align: center;
        }
        
        h1 {
            font-size: 2.8rem;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }
        
        .subtitle {
            font-size: 1.4rem;
            opacity: 0.9;
            margin-bottom: 10px;
        }
        
        .main-content {
            display: flex;
            flex-wrap: wrap;
            padding: 30px;
            min-height: 800px;
        }
        
        .sidebar {
            flex: 1;
            min-width: 350px;
            background-color: #f8fafc;
            padding: 25px;
            border-radius: 15px;
            margin-left: 30px;
            margin-bottom: 30px;
            order: 2;
        }
        
        .content-area {
            flex: 2;
            min-width: 600px;
            padding: 15px;
            order: 1;
        }
        
        .unit {
            background-color: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            border-left: 8px solid #3498db;
        }
        
        .unit h3 {
            color: #2980b9;
            margin-bottom: 20px;
            font-size: 1.8rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .unit-content {
            padding-left: 15px;
            font-size: 1.1rem;
        }
        
        .tab-container {
            margin-bottom: 40px;
        }
        
        .tabs {
            display: flex;
            background-color: #eef2f7;
            border-radius: 15px 15px 0 0;
            overflow: hidden;
        }
        
        .tab {
            flex: 1;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.2rem;
            transition: all 0.3s;
        }
        
        .tab:hover {
            background-color: #dce5f0;
        }
        
        .tab.active {
            background-color: #3498db;
            color: white;
        }
        
        .tab-content {
            display: none;
            padding: 30px;
            background-color: white;
            border-radius: 0 0 15px 15px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
            min-height: 600px;
        }
        
        .tab-content.active {
            display: block;
        }
        
        .question {
            background-color: #f8fafc;
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 12px;
            border-left: 6px solid #3498db;
        }
        
        .question h4 {
            margin-bottom: 15px;
            color: #2980b9;
            font-size: 1.4rem;
        }
        
        .question p {
            margin-bottom: 15px;
            font-size: 1.1rem;
        }
        
        .options {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 15px;
        }
        
        .option {
            padding: 15px 20px;
            background-color: #eef2f7;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 1.1rem;
            flex: 1;
            min-width: 150px;
            text-align: center;
            border: 2px solid transparent;
        }
        
        .option:hover {
            background-color: #dce5f0;
            transform: translateY(-3px);
        }
        
        .option.selected {
            background-color: #3498db;
            color: white;
            border-color: #2980b9;
        }
        
        /* === 全局統一的視覺反饋樣式 === */
        
        /* 正確答案樣式 - 全局 */
        .option.correct-answer {
            background-color: #d5f4e6 !important;
            border-color: #2ecc71 !important;
            color: #155724 !important;
        }
        
        /* 錯誤答案樣式 - 全局 */
        .option.incorrect-answer {
            background-color: #fce4ec !important;
            border-color: #e74c3c !important;
            color: #721c24 !important;
        }
        
        .answer-input {
            width: 100%;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            margin-top: 15px;
            font-size: 1.1rem;
            transition: all 0.3s;
        }
        
        /* 輸入框正確樣式 */
        .answer-input.correct-answer {
            background-color: #d5f4e6 !important;
            border-color: #2ecc71 !important;
            color: #155724 !important;
        }
        
        /* 輸入框錯誤樣式 */
        .answer-input.incorrect-answer {
            background-color: #fce4ec !important;
            border-color: #e74c3c !important;
            color: #721c24 !important;
        }
        
        .btn {
            padding: 15px 30px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.1rem;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-weight: bold;
            margin-top: 15px;
        }

        .btn + .btn {
            margin-left: 12px;
        }
        
        .btn:hover {
            background-color: #2980b9;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        .btn-check {
            background-color: #27ae60;
        }
        
        .btn-check:hover {
            background-color: #219653;
        }
        
        .btn-reset {
            background-color: #e67e22;
        }
        
        .btn-reset:hover {
            background-color: #d35400;
        }
        
        .btn-reference {
            background-color: #9b59b6;
        }
        
        .btn-reference:hover {
            background-color: #8e44ad;
        }
        
        .btn-undo {
            background-color: #95a5a6;
        }
        
        .btn-undo:hover {
            background-color: #7f8c8d;
        }
        
        .result {
            padding: 20px;
            margin-top: 20px;
            border-radius: 10px;
            display: none;
            font-size: 1.1rem;
        }
        
        .result.correct {
            background-color: #d5f4e6;
            color: #27ae60;
            border-left: 6px solid #27ae60;
        }
        
        .result.incorrect {
            background-color: #fde8e8;
            color: #e74c3c;
            border-left: 6px solid #e74c3c;
        }
        
        .reference-answer {
            padding: 20px;
            margin-top: 20px;
            border-radius: 10px;
            display: none;
            background-color: #e8f4fc;
            color: #2980b9;
            border-left: 6px solid #3498db;
        }
        
        .reference-answer.show {
            display: block;
            animation: fadeIn 0.5s;
        }
        
        .score-container {
            text-align: center;
            padding: 30px;
            background-color: #f8fafc;
            border-radius: 15px;
            margin-top: 40px;
            display: none;
        }
        
        .score {
            font-size: 3.5rem;
            font-weight: bold;
            color: #3498db;
            margin: 15px 0;
        }
        
        .vocabulary-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .vocabulary-item {
            background-color: #eef2f7;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            transition: all 0.3s;
        }
        
        .vocabulary-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
        }
        
        .vocabulary-icon {
            font-size: 2.5rem;
            color: #3498db;
        }
        
        .audio-btn {
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.3s;
            margin-top: 10px;
        }
        
        .audio-btn:hover {
            background-color: #2980b9;
            transform: scale(1.1);
        }
        
        .flashcard-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 25px;
            margin-top: 30px;
        }
        
        .flashcard {
            height: 300px;
            perspective: 1000px;
            cursor: pointer;
        }
        
        .flashcard-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.8s;
            transform-style: preserve-3d;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
        }
        
        .flashcard:hover .flashcard-inner {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
        }
        
        .flashcard.flipped .flashcard-inner {
            transform: rotateY(180deg) translateY(-10px);
        }
        
        .flashcard-front, .flashcard-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        /* 詞彙卡片正面 - 漸變藍色 */
        .flashcard-front {
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
            box-shadow: inset 0 0 30px rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.1);
        }
        
        .flashcard-back {
            background-color: #f8f9fa;
            color: #333;
            transform: rotateY(180deg);
            overflow: hidden;
            text-align: left;
            justify-content: flex-start;
            padding-top: 30px;
        }
        
        .flashcard-word {
            font-size: 1.8rem;
            font-weight: bold;
            margin-bottom: 15px;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.3);
            color: white;
        }
        
        .flashcard-meaning {
            font-size: 1.3rem;
            margin-bottom: 20px;
            opacity: 0.9;
            color: white;
        }
        
        .flashcard-icon {
            font-size: 3.5rem;
            margin-bottom: 20px;
            opacity: 0.9;
            color: white;
        }
        
        .example-sentence {
            font-size: 1.2rem;
            margin-bottom: 15px;
            line-height: 1.4;
            color: #333;
            font-style: italic;
            text-align: center;
            width: 100%;
        }
        
        .example-translation {
            font-size: 1.1rem;
            color: #333;
            margin-bottom: 20px;
            text-align: center;
            width: 100%;
        }
        
        .example-audio-btn {
            padding: 10px 20px;
            background-color: #9b59b6;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.3s;
            margin-top: 10px;
        }
        
        .example-audio-btn:hover {
            background-color: #8e44ad;
            transform: scale(1.05);
        }
        
        .pagination-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 40px;
            padding: 20px;
        }
        
        .page-btn {
            padding: 12px 25px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: bold;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .page-btn:hover:not(:disabled) {
            background-color: #2980b9;
            transform: translateY(-3px);
        }
        
        .page-btn:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
            opacity: 0.6;
        }
        
        .page-indicator {
            font-size: 1.2rem;
            font-weight: bold;
            color: #3498db;
        }
        
        /* 活動練習樣式 */
        .activity-container {
            margin-top: 30px;
        }
        
        .activity-section {
            background-color: #f8fafc;
            padding: 25px;
            margin-bottom: 30px;
            border-radius: 15px;
            border-left: 6px solid #3498db;
            position: relative;
        }
        
        .activity-title {
            color: #2980b9;
            margin-bottom: 20px;
            font-size: 1.6rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .drag-drop-area {
            display: flex;
            gap: 30px;
            margin-top: 20px;
        }
        
        .drop-zone {
            flex: 1;
            min-height: 300px;
            background-color: #eef2f7;
            border: 3px dashed #3498db;
            border-radius: 15px;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }
        
        .drop-zone-title {
            text-align: center;
            font-weight: bold;
            font-size: 1.3rem;
            margin-bottom: 15px;
            color: #2980b9;
        }
        
        .drag-items-container {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .drag-item {
            padding: 15px 20px;
            background-color: #3498db;
            color: white;
            border-radius: 8px;
            cursor: move;
            user-select: none;
            text-align: center;
            font-weight: bold;
            transition: all 0.3s;
            border: 2px solid transparent;
        }
        
        .drag-item:hover {
            background-color: #2980b9;
            transform: translateY(-3px);
        }
        
        .drag-item.dragging {
            opacity: 0.5;
        }
        
        .drag-item.correct-answer {
            background-color: #d5f4e6 !important;
            border-color: #2ecc71 !important;
            color: #155724 !important;
        }
        
        .drag-item.incorrect-answer {
            background-color: #fce4ec !important;
            border-color: #e74c3c !important;
            color: #721c24 !important;
        }
        
        .dropped-item {
            padding: 12px 18px;
            background-color: #2ecc71;
            color: white;
            border-radius: 8px;
            margin-bottom: 10px;
            text-align: center;
            font-weight: bold;
        }
        
        .match-container {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }
        
        .question-list, .answer-list {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .match-item {
            padding: 20px;
            background-color: #eef2f7;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
            font-weight: bold;
            border: 2px solid transparent;
        }
        
        .match-item:hover {
            background-color: #dce5f0;
            transform: translateY(-3px);
        }
        
        .match-item.selected {
            background-color: #3498db;
            color: white;
            border-color: #2980b9;
        }
        
        .match-item.correct-answer {
            background-color: #d5f4e6 !important;
            border-color: #2ecc71 !important;
            color: #155724 !important;
        }
        
        .match-item.incorrect-answer {
            background-color: #fce4ec !important;
            border-color: #e74c3c !important;
            color: #721c24 !important;
        }
        
        .match-item.matched {
            background-color: #2ecc71;
            color: white;
        }
        
        .match-line {
            position: absolute;
            background-color: #3498db;
            height: 3px;
            pointer-events: none;
            z-index: 1;
        }
        
        .fill-blank-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .fill-blank-item {
            background-color: #eef2f7;
            padding: 20px;
            border-radius: 10px;
        }
        
        .blank-sentence {
            font-size: 1.2rem;
            margin-bottom: 15px;
            line-height: 1.6;
        }
        
        .blank-input {
            width: 100px;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 1.1rem;
            text-align: center;
            transition: all 0.3s;
        }
        
        .blank-input-large {
            width: 200px;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 1.1rem;
            text-align: center;
            transition: all 0.3s;
        }
        
        /* 語法填空正確樣式 */
        .blank-input.correct-answer,
        .blank-input-large.correct-answer {
            background-color: #d5f4e6 !important;
            border-color: #2ecc71 !important;
            color: #155724 !important;
        }
        
        /* 語法填空錯誤樣式 */
        .blank-input.incorrect-answer,
        .blank-input-large.incorrect-answer {
            background-color: #fce4ec !important;
            border-color: #e74c3c !important;
            color: #721c24 !important;
        }
        
        /* 事實與觀點表格樣式 */
        .fact-opinion-table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            background-color: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }
        
        .fact-opinion-table th {
            background-color: #3498db;
            color: white;
            padding: 15px;
            text-align: center;
            font-weight: bold;
        }
        
        .fact-opinion-table td {
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid #eee;
        }
        
        .fact-opinion-table tr:last-child td {
            border-bottom: none;
        }
        
        .fact-opinion-table tr:hover {
            background-color: #f8fafc;
        }
        
        .checkbox-option {
            width: 40px;
            height: 40px;
            border: 2px solid #3498db;
            border-radius: 5px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1.5rem;
            color: transparent;
        }
        
        .checkbox-option:hover {
            background-color: #e8f4fc;
        }
        
        .checkbox-option.selected {
            background-color: #3498db;
            color: white;
        }
        
        .checkbox-option.correct {
            background-color: #d5f4e6;
            border-color: #2ecc71;
            color: #2ecc71;
        }
        
        .checkbox-option.incorrect {
            background-color: #fce4ec;
            border-color: #e74c3c;
            color: #e74c3c;
        }
        
        .badge {
            display: inline-block;
            background-color: #f1c40f;
            color: #333;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            margin-top: 20px;
            font-size: 1.2rem;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }
        
        .feedback {
            padding: 15px;
            margin-top: 15px;
            border-radius: 8px;
            font-weight: bold;
            display: none;
        }
        
        .feedback.correct {
            background-color: #d5f4e6;
            color: #27ae60;
            border-left: 4px solid #27ae60;
        }
        
        .feedback.incorrect {
            background-color: #fde8e8;
            color: #e74c3c;
            border-left: 4px solid #e74c3c;
        }
        
        .progress-bar {
            height: 15px;
            background-color: #e0e0e0;
            border-radius: 10px;
            margin: 25px 0;
            overflow: hidden;
        }
        
        .progress {
            height: 100%;
            background-color: #3498db;
            width: 0%;
            transition: width 0.5s;
            border-radius: 10px;
        }
        
        .reading-sample {
            background-color: #f8fafc;
            padding: 25px;
            border-radius: 15px;
            margin-top: 30px;
            border: 2px dashed #3498db;
            font-family: 'Segoe UI', sans-serif;
            font-size: 1.1rem;
            line-height: 1.8;
        }
        
        .paragraph-container {
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px solid #eee;
        }
        
        .paragraph-container:last-child {
            border-bottom: none;
        }
        
        .paragraph-content {
            font-size: 1.1rem;
            line-height: 1.7;
            margin-bottom: 15px;
        }
        
        .paragraph-buttons {
            display: flex;
            gap: 15px;
            margin-top: 10px;
        }
        
        .paragraph-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            border: none;
            font-size: 1.3rem;
        }
        
        .audio-paragraph-btn {
            background-color: #3498db;
            color: white;
        }
        
        .audio-paragraph-btn:hover {
            background-color: #2980b9;
            transform: scale(1.1);
        }
        
        .translate-btn {
            background-color: #9b59b6;
            color: white;
        }
        
        .translate-btn:hover {
            background-color: #8e44ad;
            transform: scale(1.1);
        }
        
        .translation {
            display: none;
            background-color: #f8f9fa;
            padding: 20px;
            margin-top: 15px;

            border-radius: 2px;
            background: #3498db;
            animation: waveBounce 0.9s ease-in-out infinite;
        }
        .wave-bars span:nth-child(2) { animation-delay: 0.15s; }
        .wave-bars span:nth-child(3) { animation-delay: 0.3s; }
        .wave-bars span:nth-child(4) { animation-delay: 0.45s; }
        .wave-bars span:nth-child(5) { animation-delay: 0.6s; }
        .wave-bars.paused span {

        /* v18：段落句子化——懸浮句子中英高亮、點擊句子只朗讀該句 */

                        <div id="reading-render"></div>
                    </div>
                    
                    <div class="tab-content" id="practice">
                        <div id="practice-render"></div>
                    </div>
                    
                    <div class="tab-content" id="quiz">
                        <div id="quiz-render"></div>
                    </div>
                    
                    <div class="tab-content" id="learning">
                        <div id="learning-render"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 完成總結彈窗 -->
    <div class="summary-modal" id="summaryModal">
        <div class="summary-content">
            <div class="summary-header">
                <h2><i class="fas fa-trophy"></i> 恭喜完成單元學習！</h2>
                <div class="summary-stars" id="summaryStars">
                    <!-- 星星將由JavaScript生成 -->
                </div>
                <p>你已完成所有練習題</p>
            </div>
            
            <div class="progress-summary" style="margin: 20px 0;">
                <h3>學習成果總結</h3>
                <div class="progress-circle" style="width: 100px; height: 100px;">
                    <div class="progress-circle-inner">
                        <span id="finalProgress">0%</span>
                    </div>
                </div>
                <p>已完成 <strong id="finalCompleted">0</strong>/<strong id="finalTotal">8</strong> 個練習</p>
            </div>
            
            <div id="weaknessSection" style="display: none;">
                <h3><i class="fas fa-exclamation-triangle"></i> 建議加強練習</h3>
                <div class="weakness-list" id="modalWeaknessList">
                    <!-- 薄弱環節將由JavaScript生成 -->
                </div>
            </div>
            
            <div style="text-align: center; margin-top: 30px;">
                <button class="btn" onclick="closeSummary()" style="background-color: #3498db;">
                    <i class="fas fa-check"></i> 確認
                </button>
                <button class="btn btn-reset" onclick="resetPracticeWithSilentNotification()" style="margin-left: 15px;">
                    <i class="fas fa-redo"></i> 重新練習
                </button>
            </div>
        </div>
    </div>

    <!-- 靜默通知 -->
    <div class="silent-notification" id="silentNotification">
        <div id="notificationContent"></div>
    </div>

    <!-- 音頻播放器 -->
    <audio id="audioPlayer" class="audio-player"></audio>

    <!-- 回到頂點按鈕 -->
    <button class="back-to-top" id="backToTop" aria-label="回到頂部"><i class="fas fa-chevron-up"></i></button>

<script>
        // ==================== 全局變數 ====================
        // 答案資料（由 data.json 載入後填充）
        let LESSON = null;
        let currentPage = 1;
        let totalPages = 3;
        let answers = {};
        let factOpinionAnswers = {};
        let vocabMatchingAnswers = {};
        let readingCompAnswers = {};
        let gadgetCategories = {};
        let quizAnswers = {};
        let completedPractice = 0;
        let totalPracticeQuestions = 8;
        let correctAnswers = 0;
        let practiceScores = {};
        let MAX_QUIZ_SCORE = 15;
        let currentAudio = null;
        let STORAGE_KEY = 'unit5_gadgets_progress';
        let dragHistory = [];
        
        // ==================== 初始化功能 ====================
        function bindEvents() {
            // 載入保存的學習進度
            loadProgress();
            
            // 初始化分頁
            showPage(1);
            
            // 分頁按鈕事件
            document.getElementById('prevPage').addEventListener('click', function() {
                if (currentPage > 1) showPage(currentPage - 1);
            });
            
            document.getElementById('nextPage').addEventListener('click', function() {
                if (currentPage < totalPages) showPage(currentPage + 1);
            });
            
            // 分頁切換功能
            const tabs = document.querySelectorAll('.tab');
            const tabContents = document.querySelectorAll('.tab-content');
            
            tabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    const targetTab = tab.getAttribute('data-tab');
                    
                    // 更新分頁狀態
                    tabs.forEach(t => t.classList.remove('active'));
                    tabContents.forEach(c => c.classList.remove('active'));
                    
                    tab.classList.add('active');
                    document.getElementById(targetTab).classList.add('active');
                    
                    // 如果切換到測驗分頁，重置測驗狀態
                    if(targetTab === 'quiz') {
                        resetQuiz();
                    }
                    
                    // 保存當前分頁
                    saveProgress();
                });
            });
            
            // 詞彙卡翻轉功能
            const flashcards = document.querySelectorAll('.flashcard');
            flashcards.forEach(card => {
                card.addEventListener('click', function() {
                    this.classList.toggle('flipped');
                });
            });
            
            // 選擇題功能
            const options = document.querySelectorAll('.option[data-answer], .option[data-question], .option[data-quiz], .option[data-match], .option[data-reading]');
            options.forEach(option => {
                option.addEventListener('click', function() {
                    handleOptionClick(this);
                });
                
                // 鍵盤導航支持
                option.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        handleOptionClick(this);
                    }
                });
            });
            
            // 提交
            document.getElementById('submitQuiz').addEventListener('click', submitQuiz);
            
            // 重置測驗按鈕
            document.getElementById('resetTest').addEventListener('click', resetQuiz);
            
            // 音頻按鈕功能
            initializeAudioButtons();
            
            // 拖拽功能初始化
            initializeDragAndDrop();
            
            // 例句展開/收起功能
            document.querySelectorAll('.example-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    toggleExampleContent(this);
                });
            });
            
            // 翻譯按鈕功能
            document.querySelectorAll('.translate-btn').forEach(button => {
                button.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const translationId = this.getAttribute('data-translation');
                    toggleTranslation(translationId);
                });
            });
            
            // 歌詞點擊解釋功能
            document.querySelectorAll('.lyric-line').forEach(line => {
                line.addEventListener('click', function() {
                    const allLines = document.querySelectorAll('.lyric-line');
                    allLines.forEach(l => l.classList.remove('selected'));
                    this.classList.add('selected');
                });
            });
            
            // 更新進度顯示
            updateProgressDisplay();
        
        }
        // ==================== 分頁控制 ====================
        function showPage(pageNum) {
            // 隱藏所有頁面
            for (let i = 1; i <= totalPages; i++) {
                const pageElement = document.getElementById(`page${i}`);
                if (pageElement) pageElement.style.display = 'none';
            }
            
            // 顯示當前頁面
            const currentPageElement = document.getElementById(`page${pageNum}`);
            if (currentPageElement) currentPageElement.style.display = 'grid';
            
            // 更新頁面指示器
            document.getElementById('pageIndicator').textContent = `第 ${pageNum} 頁 / 共 ${totalPages} 頁`;
            
            // 更新按鈕狀態
            document.getElementById('prevPage').disabled = pageNum === 1;
            document.getElementById('nextPage').disabled = pageNum === totalPages;
            
            currentPage = pageNum;
        }
        
        // ==================== 學習進度管理 ====================
        function loadProgress() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try {
                    const progress = JSON.parse(saved);
                    completedPractice = progress.completed || 0;
                    correctAnswers = progress.correct || 0;
                    practiceScores = progress.scores || {};
                } catch (e) {
                    // 解析失敗，重新開始
                }
            }
        }
        
        function saveProgress() {
            const progress = {
                completed: completedPractice,
                correct: correctAnswers,
                scores: practiceScores,
                timestamp: new Date().getTime()
            };
            
            localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
        }
        
        function updateProgressDisplay() {
            const progressPercent = Math.round((completedPractice / totalPracticeQuestions) * 100);
            const correctRate = completedPractice > 0 ? Math.round((correctAnswers / completedPractice) * 100) : 0;
            
            // 更新進度圓環
            document.getElementById('progressPercent').textContent = `${progressPercent}%`;
            const progressCircle = document.getElementById('progressCircle');
            progressCircle.style.background = `conic-gradient(#3498db 0% ${progressPercent}%, #eef2f7 ${progressPercent}% 100%)`;
            
            // 更新統計數字
            document.getElementById('completedCount').textContent = completedPractice;
            document.getElementById('totalCount').textContent = totalPracticeQuestions;
            document.getElementById('correctRate').textContent = `${correctRate}%`;
            
            // 更新進度條
            const progressBar = document.getElementById('practice-progress');
            if (progressBar) {
                progressBar.style.width = `${progressPercent}%`;
            }
            
            // 更新進度文字
            const progressText = document.getElementById('progress-text');
            if (progressText) {
                progressText.textContent = `進度: ${completedPractice}/${totalPracticeQuestions} 已完成`;
            }
            
            // 更新建議
            const nextRecommendation = document.getElementById('nextRecommendation');
            if (nextRecommendation) {
                if (completedPractice === 0) {
                    nextRecommendation.textContent = '開始練習以追蹤進度';
                } else if (completedPractice < totalPracticeQuestions) {
                    nextRecommendation.textContent = '繼續完成所有練習';
                } else {
                    nextRecommendation.textContent = '太棒了！已完成所有練習';
                    document.getElementById('completionMessage').style.display = 'inline-block';
                }
            }
            
            // 保存進度
            saveProgress();
            
            // 如果完成所有練習，顯示總結
            if (completedPractice === totalPracticeQuestions) {
                setTimeout(() => {
                    showSummary();
                }, 500);
            }
        }
        
        // ==================== 音頻管理 ====================
        function stopCurrentAudio() {
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
            }
        }
        
        function initializeAudioButtons() {
            // 詞彙音頻按鈕
            const audioButtons = document.querySelectorAll('.audio-btn');
            audioButtons.forEach(button => {
                button.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const audioType = this.getAttribute('data-audio');
                    playAudio(audioType, this);
                });
            });
            
            // 例句音頻按鈕
            const exampleAudioButtons = document.querySelectorAll('.example-audio-btn');
            exampleAudioButtons.forEach(button => {
                button.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const audioType = this.getAttribute('data-audio');
                    playAudio(audioType, this);
                });
            });
            
            // 段落音頻按鈕
            const paragraphAudioButtons = document.querySelectorAll('.audio-paragraph-btn');
            paragraphAudioButtons.forEach(button => {
                button.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const audioFile = this.getAttribute('data-audio');
                    playAudio(audioFile, this);
                });
            });

    // 文法結構卡片的音頻按鈕
    const grammarAudioButtons = document.querySelectorAll('.audio-example-btn');
    grammarAudioButtons.forEach(button => {
        button.addEventListener('click', function(e) {
            e.stopPropagation();
            const audioType = this.getAttribute('data-audio');
            playAudio(audioType, this);
        });
    });


        }
        
        function playAudio(audioType, button) {
            // 停止當前播放的音頻
            stopCurrentAudio();
            
            const audioFile = audioType.replace(/ /g, '_');
            const audioUrl = `./audio/${audioFile}.mp3`;
            
            currentAudio = new Audio(audioUrl);
            
            if (button) {
                button.classList.add('loading');
            }
            
            currentAudio.play().then(() => {
                if (button) {
                    setTimeout(() => {
                        button.classList.remove('loading');
                    }, 500);
                }
                
                // 音頻播放結束後釋放資源
                currentAudio.onended = function() {
                    currentAudio = null;
                };
            }).catch(e => {
                if (button) {
                    button.classList.remove('loading');
                }
                showSilentNotification('音頻文件未找到，請檢查audio資料夾');
            });
        }
        
        function playSong() {
            const button = document.querySelector('.song-play-btn');
            stopCurrentAudio();
            
            const audioUrl = './audio/little_amy.mp3';
            currentAudio = new Audio(audioUrl);
            
            button.classList.add('loading');
            
            currentAudio.play().then(() => {
                setTimeout(() => {
                    button.classList.remove('loading');
                    button.innerHTML = '<i class="fas fa-pause"></i> 暫停歌曲';
                    button.onclick = pauseSong;
                }, 500);
                
                currentAudio.onended = function() {
                    currentAudio = null;
                    button.innerHTML = '<i class="fas fa-play"></i> 播放歌曲';
                    button.onclick = playSong;
                };
            }).catch(e => {
                button.classList.remove('loading');
                showSilentNotification('歌曲文件未找到，請檢查audio資料夾');
            });
        }
        
        function pauseSong() {
            const button = document.querySelector('.song-play-btn');
            if (currentAudio) {
                currentAudio.pause();
                button.innerHTML = '<i class="fas fa-play"></i> 播放歌曲';
                button.onclick = playSong;
            }
        }
        
        // ==================== 答案檢查通用函數 ====================
        function markElementCorrect(element) {
            if (!element) return;
            element.classList.remove('incorrect-answer');
            element.classList.add('correct-answer');
            
            if (element.tagName === 'INPUT' || element.tagName === 'TEXTAREA') {
                element.style.borderColor = '#2ecc71';
                element.style.backgroundColor = '#d5f4e6';
            }
        }
        
        function markElementIncorrect(element) {
            if (!element) return;
            element.classList.remove('correct-answer');
            element.classList.add('incorrect-answer');
            
            if (element.tagName === 'INPUT' || element.tagName === 'TEXTAREA') {
                element.style.borderColor = '#e74c3c';
                element.style.backgroundColor = '#fce4ec';
            }
        }
        
        function clearElementMark(element) {
            if (!element) return;
            element.classList.remove('correct-answer', 'incorrect-answer', 'correct-unanswered');
            
            if (element.tagName === 'INPUT' || element.tagName === 'TEXTAREA') {
                element.style.borderColor = '#ddd';
                element.style.backgroundColor = 'white';
            } else {
                element.style.backgroundColor = '';
                element.style.borderColor = '';
            }
        }
        
        // ==================== 練習題答案檢查 ====================
        
        // 練習1：事實與觀點辨析題
        function selectFactOpinion(questionNum, type) {
            const factCheckbox = document.querySelector(`.checkbox-option[data-question="${questionNum}"][data-type="fact"]`);
            const opinionCheckbox = document.querySelector(`.checkbox-option[data-question="${questionNum}"][data-type="opinion"]`);
            
            // 清除兩個選項的選中狀態
            factCheckbox.classList.remove('selected');
            opinionCheckbox.classList.remove('selected');
            
            // 選中點擊的選項
            if (type === 'fact') {
                factCheckbox.classList.add('selected');
            } else {
                opinionCheckbox.classList.add('selected');
            }
        }
        
        function checkFactOpinion() {
            const feedback = document.getElementById('factOpinionFeedback');
            let correctCount = 0;
            let answeredCount = 0;
            
            for (let i = 1; i <= 5; i++) {
                const factCheckbox = document.querySelector(`.checkbox-option[data-question="${i}"][data-type="fact"]`);
                const opinionCheckbox = document.querySelector(`.checkbox-option[data-question="${i}"][data-type="opinion"]`);
                
                // 檢查是否有選中
                const isFactSelected = factCheckbox.classList.contains('selected');
                const isOpinionSelected = opinionCheckbox.classList.contains('selected');
                
                if (isFactSelected || isOpinionSelected) {
                    answeredCount++;
                    
                    // 清除之前的標記
                    clearElementMark(factCheckbox);
                    clearElementMark(opinionCheckbox);
                    
                    const correctAnswer = factOpinionAnswers[i];
                    const isCorrect = (correctAnswer === 'fact' && isFactSelected) || 
                                     (correctAnswer === 'opinion' && isOpinionSelected);
                    
                    if (isCorrect) {
                        if (correctAnswer === 'fact') {
                            markElementCorrect(factCheckbox);
                        } else {
                            markElementCorrect(opinionCheckbox);
                        }
                        correctCount++;
                    } else {
                        if (isFactSelected) {
                            markElementIncorrect(factCheckbox);
                        } else {
                            markElementIncorrect(opinionCheckbox);
                        }
                        
                        // 顯示正確答案
                        if (correctAnswer === 'fact') {
                            markElementCorrect(factCheckbox);
                        } else {
                            markElementCorrect(opinionCheckbox);
                        }
                    }
                }
            }
            
            feedback.style.display = 'block';
            
            if (answeredCount === 0) {
                feedback.className = 'feedback incorrect';
                feedback.innerHTML = '❌ 請先選擇答案！';
            } else if (answeredCount < 5) {
                feedback.className = 'feedback incorrect';
                feedback.innerHTML = `❌ 還有 ${5 - answeredCount} 題未回答`;
            } else if (correctCount === 5) {
                feedback.className = 'feedback correct';
                feedback.innerHTML = '✅ 太棒了！全部正確！';
                
                // 更新進度
                if (!practiceScores.factOpinion) {
                    completedPractice++;
                    correctAnswers++;
                    practiceScores.factOpinion = 1;
                    updateProgressDisplay();
                }
            } else {
                feedback.className = 'feedback incorrect';
                feedback.innerHTML = `❌ 正確: ${correctCount}/5`;
            }
        }
        
        function resetFactOpinion() {
            for (let i = 1; i <= 5; i++) {
                const factCheckbox = document.querySelector(`.checkbox-option[data-question="${i}"][data-type="fact"]`);
                const opinionCheckbox = document.querySelector(`.checkbox-option[data-question="${i}"][data-type="opinion"]`);
                
                factCheckbox.classList.remove('selected', 'correct-answer', 'incorrect-answer');
                opinionCheckbox.classList.remove('selected', 'correct-answer', 'incorrect-answer');
            }
            
            const feedback = document.getElementById('factOpinionFeedback');
            feedback.style.display = 'none';
            
            // 移除進度
            if (practiceScores.factOpinion) {
                completedPractice--;
                correctAnswers--;
                delete practiceScores.factOpinion;
                updateProgressDisplay();
            }
        }
        
        // 練習2：詞彙匹配題
        let selectedVocabQuestion = null;
        let selectedVocabAnswer = null;
        
        function selectVocabQuestion(questionNum) {
            selectedVocabQuestion = questionNum;
            const questionItems = document.querySelectorAll('.question-list .match-item');
            questionItems.forEach(item => {
                item.classList.remove('selected');
                item.style.borderColor = 'transparent';
            });
            
            const selectedItem = document.querySelector(`.match-item[data-question="${questionNum}"]`);
            selectedItem.classList.add('selected');
            selectedItem.style.borderColor = '#2980b9';
            
            if (selectedVocabAnswer) checkSingleVocabMatch();
        }
        
        function selectVocabAnswer(answerLetter) {
            selectedVocabAnswer = answerLetter;
            const answerItems = document.querySelectorAll('.answer-list .match-item');
            answerItems.forEach(item => {
                item.classList.remove('selected');
                item.style.borderColor = 'transparent';
            });
            
            const selectedItem = document.querySelector(`.match-item[data-answer="${answerLetter}"]`);
            selectedItem.classList.add('selected');
            selectedItem.style.borderColor = '#2980b9';
            
            if (selectedVocabQuestion) checkSingleVocabMatch();
        }
        
        function checkSingleVocabMatch() {
            if (selectedVocabQuestion && selectedVocabAnswer) {
                const questionItem = document.querySelector(`.match-item[data-question="${selectedVocabQuestion}"]`);
                const answerItem = document.querySelector(`.match-item[data-answer="${selectedVocabAnswer}"]`);
                
                clearElementMark(questionItem);
                clearElementMark(answerItem);
                
                if (vocabMatchingAnswers[selectedVocabQuestion] === selectedVocabAnswer) {
                    markElementCorrect(questionItem);
                    markElementCorrect(answerItem);
                    questionItem.classList.add('matched');
                    answerItem.classList.add('matched');
                    
                    // 更新進度
                    if (!practiceScores[`vocabMatch${selectedVocabQuestion}`]) {
                        practiceScores[`vocabMatch${selectedVocabQuestion}`] = 1;
                    }
                } else {
                    markElementIncorrect(questionItem);
                    markElementIncorrect(answerItem);
                }
                
                selectedVocabQuestion = null;
                selectedVocabAnswer = null;
                
                // 檢查是否完成所有配對
                checkVocabMatchingProgress();
            }
        }
        
        function checkVocabMatchingProgress() {
            let completedMatches = 0;
            for (let i = 1; i <= 3; i++) {
                const questionItem = document.querySelector(`.match-item[data-question="${i}"]`);
                if (questionItem && questionItem.classList.contains('matched')) {
                    completedMatches++;
                }
            }
            
            // 如果完成所有配對，更新進度
            if (completedMatches === 3 && !practiceScores.vocabMatchingComplete) {
                completedPractice++;
                correctAnswers++;
                practiceScores.vocabMatchingComplete = 1;
                updateProgressDisplay();
            }
        }
        
        function checkVocabMatching() {
            const feedback = document.getElementById('vocabMatchingFeedback');
            let correctCount = 0;
            
            for (const [question, correctAnswer] of Object.entries(vocabMatchingAnswers)) {
                const questionItem = document.querySelector(`.match-item[data-question="${question}"]`);
                const answerItem = document.querySelector(`.match-item[data-answer="${correctAnswer}"]`);
                
                if (questionItem && questionItem.classList.contains('matched') && 
                    answerItem && answerItem.classList.contains('matched')) {
                    correctCount++;
                }
            }
            
            if (correctCount === 3) {
                feedback.className = 'feedback correct';
                feedback.innerHTML = '✅ 太棒了！全部正確！';
            } else {
                feedback.className = 'feedback incorrect';
                feedback.innerHTML = `❌ 已完成 ${correctCount}/3 個配對`;
            }
            
            feedback.style.display = 'block';
        }
        
        function resetVocabMatching() {
            const allItems = document.querySelectorAll('.match-item');
            allItems.forEach(item => {
                item.classList.remove('selected', 'matched');
                clearElementMark(item);
                item.style.borderColor = 'transparent';
            });
            
            selectedVocabQuestion = null;
            selectedVocabAnswer = null;
            
            const feedback = document.getElementById('vocabMatchingFeedback');
            feedback.style.display = 'none';
            
            // 移除進度
            if (practiceScores.vocabMatchingComplete) {
                completedPractice--;
                correctAnswers--;
                delete practiceScores.vocabMatchingComplete;
                for (let i = 1; i <= 3; i++) {
                    delete practiceScores[`vocabMatch${i}`];
                }
                updateProgressDisplay();
            }
        }
        
        // 練習3：閱讀理解選擇題
        function checkReadingComp() {
            const feedback = document.getElementById('readingCompFeedback');
            let correctCount = 0;
            let answeredCount = 0;
            
            for (const [id, answer] of Object.entries(readingCompAnswers)) {
                const selectedOption = document.querySelector(`.option.selected[data-question="${id}"]`);
                
                if (selectedOption) {
                    answeredCount++;
                    const userAnswer = selectedOption.getAttribute('data-answer');
                    
                    clearElementMark(selectedOption);
                    
                    if (userAnswer === answer) {
                        markElementCorrect(selectedOption);
                        correctCount++;
                    } else {
                        markElementIncorrect(selectedOption);
                    }
                }
            }
            
            if (answeredCount === 0) {
                feedback.className = 'feedback incorrect';
                feedback.innerHTML = '❌ 請先選擇答案！';
            } else if (answeredCount < 6) {
                feedback.className = 'feedback incorrect';
                feedback.innerHTML = `❌ 還有 ${6 - answeredCount} 題未回答`;
            } else if (correctCount === 6) {
                feedback.className = 'feedback correct';
                feedback.innerHTML = '✅ 太棒了！全部正確！';
                
                // 更新進度
                if (!practiceScores.readingComp) {
                    completedPractice++;
                    correctAnswers++;
                    practiceScores.readingComp = 1;
                    updateProgressDisplay();

        // 練習8：科技產品分類拖拽
        function initializeDragAndDrop() {
            const dragItems = document.querySelectorAll('.drag-item[data-gadget]');
            const oldZone = document.getElementById('oldGadgetsZone');
            const newZone = document.getElementById('newGadgetsZone');
            
            dragItems.forEach(item => {
                item.setAttribute('draggable', 'true');
                
                item.addEventListener('dragstart', function(e) {
                    this.classList.add('dragging');
                    e.dataTransfer.setData('text/plain', JSON.stringify({
                        gadget: this.getAttribute('data-gadget'),
                        category: this.getAttribute('data-category'),
                        elementId: this.id || `drag-${Date.now()}`
                    }));
                });
                
                item.addEventListener('dragend', function() {
                    this.classList.remove('dragging');
                });
            });
            
            // 舊科技產品區域
            if (oldZone) {
                oldZone.addEventListener('dragover', function(e) {
                    e.preventDefault();
                    this.style.backgroundColor = '#dce5f0';
                });
                
                oldZone.addEventListener('dragleave', function() {
                    this.style.backgroundColor = '#eef2f7';
                });
                
                oldZone.addEventListener('drop', function(e) {
                    e.preventDefault();
                    this.style.backgroundColor = '#eef2f7';
                    
                    try {
                        const data = JSON.parse(e.dataTransfer.getData('text/plain'));
                        handleDrop(data, 'old');
                    } catch (error) {
                        console.error('拖拽數據解析錯誤:', error);
                    }
                });
            }
            
            // 新科技產品區域
            if (newZone) {
                newZone.addEventListener('dragover', function(e) {
                    e.preventDefault();
                    this.style.backgroundColor = '#dce5f0';
                });
                
                newZone.addEventListener('dragleave', function() {
                    this.style.backgroundColor = '#eef2f7';
                });
                
                newZone.addEventListener('drop', function(e) {
                    e.preventDefault();
                    this.style.backgroundColor = '#eef2f7';
                    
                    try {
                        const data = JSON.parse(e.dataTransfer.getData('text/plain'));
                        handleDrop(data, 'new');
                    } catch (error) {
                        console.error('拖拽數據解析錯誤:', error);
                    }
                });
            }
        }
        
        function handleDrop(data, targetCategory) {
            const gadget = data.gadget;
            const originalCategory = data.category;
            
            // 保存歷史記錄
            dragHistory.push({
                gadget: gadget,
                fromCategory: getCurrentCategory(gadget),
                toCategory: targetCategory,
                timestamp: Date.now()
            });
            
            // 如果物品已經在目標區域，先移除
            const existingItems = document.querySelectorAll('.dropped-item');
            existingItems.forEach(item => {
                if (item.getAttribute('data-gadget') === gadget) {
                    item.remove();
                }
            });
            
            // 創建新的放置項目
            const droppedItem = document.createElement('div');
            droppedItem.className = 'dropped-item';
            droppedItem.textContent = gadget;
            droppedItem.setAttribute('data-gadget', gadget);
            droppedItem.setAttribute('data-category', targetCategory);
            
            // 添加到目標區域
            if (targetCategory === 'old') {
                document.getElementById('oldGadgetsItems').appendChild(droppedItem);
            } else {
                document.getElementById('newGadgetsItems').appendChild(droppedItem);
            }
            
            // 更新原始拖拽項目的狀態
            const dragItem = document.querySelector(`.drag-item[data-gadget="${gadget}"]`);
            if (dragItem) {
                dragItem.style.opacity = '0.3';
                dragItem.style.pointerEvents = 'none';
            }
        }
        
        function getCurrentCategory(gadget) {
            const oldItem = document.querySelector(`#oldGadgetsItems .dropped-item[data-gadget="${gadget}"]`);
            const newItem = document.querySelector(`#newGadgetsItems .dropped-item[data-gadget="${gadget}"]`);
            
            if (oldItem) return 'old';
            if (newItem) return 'new';
            return 'none';
        }

function resetQuiz() {
    // 重置所有選擇題
    const options = document.querySelectorAll('.option[data-quiz], .option[data-match], .option[data-reading]');
    options.forEach(option => {
        option.classList.remove('selected', 'correct-answer', 'incorrect-answer', 'correct-unanswered');
        option.style.borderColor = 'transparent';
        option.style.backgroundColor = '';
    });
    
    // 重置填空題
    const blanks = ['quizBlank1', 'quizBlank2', 'sentenceAnswer'];
    blanks.forEach(blankId => {
        const input = document.getElementById(blankId);
        if (input) {
            input.value = '';
            input.placeholder = blankId === 'sentenceAnswer' ? ((LESSON && LESSON.quiz) ? ((LESSON.quiz.sections.find(s => s.type === 'sentence') || {}).placeholder || '') : '') : '';
            input.classList.remove('correct-answer', 'incorrect-answer');
            input.style.borderColor = '#ddd';
            input.style.backgroundColor = 'white';
        }
        
        // 重置結果顯示
        const result = document.getElementById(`${blankId}-result`);
        if (result) {
            result.textContent = '';
            result.className = 'result';
            result.style.display = 'none';
        }
    });
    
    // 移除詳細結果分析
    const existingDetails = document.querySelector('.quiz-details');
    if (existingDetails) {
        existingDetails.remove();
    }
    
    // 隱藏分數容器
    document.getElementById('scoreContainer').style.display = "none";
}

        // ==================== 輔助功能 ====================
        function handleOptionClick(option) {
            const questionNum = option.getAttribute('data-quiz') || option.getAttribute('data-match') || 
                               option.getAttribute('data-reading') || option.getAttribute('data-question');
            const type = option.getAttribute('data-quiz') ? 'quiz' : 
                         option.getAttribute('data-match') ? 'match' : 
                         option.getAttribute('data-reading') ? 'reading' : 
                         option.getAttribute('data-question') ? 'question' : 
                         option.getAttribute('data-answer') ? 'practice' : 'unknown';
            
            // 移除同一問題中其他選項的選中狀態
            if(type === 'question' || type === 'quiz' || type === 'match' || type === 'reading') {
                const siblings = document.querySelectorAll(`.option[data-${type}="${questionNum}"]`);
                siblings.forEach(sib => {
                    sib.classList.remove('selected');
                    sib.style.borderColor = 'transparent';
                });
            } else if(type === 'practice') {
                const siblings = option.parentElement.querySelectorAll('.option');
                siblings.forEach(sib => {
                    sib.classList.remove('selected');
                    sib.style.borderColor = 'transparent';
                });
            }
            
            // 添加選中狀態
            option.classList.add('selected');
            option.style.borderColor = '#2980b9';
            option.focus();
        }
        
        function toggleExampleContent(button) {
            const content = button.nextElementSibling;
            const isOpen = content.classList.contains('open');
            
            document.querySelectorAll('.example-content.open').forEach(openContent => {

                    openContent.classList.remove('open');
                    const closeBtn = openContent.previousElementSibling;
                    closeBtn.innerHTML = '<i class="fas fa-comment-dots"></i> 例句';

            content.classList.toggle('open');

        // ==================== 總結功能 ====================
        function showSummary() {
            const progressPercent = Math.round((completedPractice / totalPracticeQuestions) * 100);
            const correctRate = completedPractice > 0 ? Math.round((correctAnswers / completedPractice) * 100) : 0;
            
            // 更新總結內容
            document.getElementById('finalProgress').textContent = `${progressPercent}%`;
            document.getElementById('finalCompleted').textContent = completedPractice;
            
            // 生成星星評價
            const starsContainer = document.getElementById('summaryStars');
            starsContainer.innerHTML = '';
            const starCount = Math.min(5, Math.floor(correctRate / 20));
            
            for (let i = 0; i < 5; i++) {
                const star = document.createElement('i');
                star.className = i < starCount ? 'fas fa-star' : 'far fa-star';
                starsContainer.appendChild(star);
            }
            
            // 檢查薄弱環節
            const weaknesses = analyzeWeaknesses();
            const weaknessSection = document.getElementById('weaknessSection');
            const modalWeaknessList = document.getElementById('modalWeaknessList');
            
            if (weaknesses.length > 0) {
                weaknessSection.style.display = 'block';
                modalWeaknessList.innerHTML = '';
                weaknesses.forEach(weakness => {
                    const li = document.createElement('div');
                    li.className = 'weakness-item';
                    li.textContent = weakness;
                    modalWeaknessList.appendChild(li);
                });
                
                // 更新側邊欄建議
                const weaknessTips = document.getElementById('weaknessTips');
                const weaknessList = document.getElementById('weaknessList');
                weaknessList.innerHTML = '';
                weaknesses.forEach(weakness => {
                    const li = document.createElement('li');
                    li.textContent = weakness;
                    weaknessList.appendChild(li);
                });
                weaknessTips.style.display = 'block';
            } else {
                weaknessSection.style.display = 'none';
                document.getElementById('weaknessTips').style.display = 'none';
            }
            
            // 顯示總結彈窗
            document.getElementById('summaryModal').style.display = 'flex';
        }
        
        function closeSummary() {
            document.getElementById('summaryModal').style.display = 'none';

        function analyzeWeaknesses() {
            const weaknesses = [];
            
            // 檢查各類練習
            if (!practiceScores.factOpinion) {
                weaknesses.push('事實與觀點辨析練習');
            }
            
            if (!practiceScores.vocabMatchingComplete) {
                weaknesses.push('詞彙匹配練習');
            }
            
            if (!practiceScores.readingComp) {
                weaknesses.push('閱讀理解選擇題');
            }
            
            if (!practiceScores.readingQA) {
                weaknesses.push('閱讀理解問答題');
            }
            
            if (!practiceScores.sentencePattern) {
                weaknesses.push('句型運用練習');
            }
            
            if (!practiceScores.comparative) {
                weaknesses.push('比較級與最高級練習');
            }
            
            if (!practiceScores.gadgetSorting) {
                weaknesses.push('科技產品分類練習');
            }
            
            return weaknesses.slice(0, 3); // 最多顯示3個

            });
            
            factOpinionAnswers = Object.assign({}, p.factOpinion.answers);

            });
        }
        

        // ==================== 改良：解題燈泡雙階段（檢查前後） + 長答案多行輸入 ====================
        function enhanceExpl() {
            if (!LESSON) return;
            // 1) 題目映射：面板 id -> 題目數據
            const map = {};
            const reg = (key, q) => { if (key) map[key] = q; };
            const pr = LESSON.practice || {};
            ((pr.readingComp && pr.readingComp.questions) || []).forEach(q => reg('expl-' + q.id, q));
            ((pr.readingQA && pr.readingQA.questions) || []).forEach((q, i) => reg('expl-q4-' + (q.id || (i + 1)), q));
            ((pr.sentencePattern && pr.sentencePattern.items) || []).forEach(it => reg('expl-' + it.id, it));
            ((pr.factOpinion && pr.factOpinion.statements) || []).forEach((st, i) => reg('expl-fo' + (i + 1), st));
            ((pr.vocabMatching && pr.vocabMatching.questions) || []).forEach(q => reg('expl-vm' + q.id, q));
            ((pr.discussion && pr.discussion.questions) || []).forEach((q, i) => reg('expl-d' + (q.id || (i + 1)), q));
            ['wordBank', 'frequency'].forEach(k => { const b = pr[k]; if (b && b.items) b.items.forEach((it, i) => reg('expl-' + (it.id || (i + 1)), it)); });
            ((LESSON.textType && LESSON.textType.questions) || []).forEach(q => reg('expl-' + q.id, q));
            ((LESSON.song && LESSON.song.questions) || []).forEach(q => reg('expl-' + q.id, q));

            const answerLine = (q) => {
                if (!q) return '';
                if (q.answer !== undefined && q.answer !== null && q.answer !== '') {
                    if (q.options && Array.isArray(q.options)) {
                        const ok = q.options.find(o => o.key === q.answer);
                        return ok ? ok.text : String(q.answer);
                    }
                    return String(q.answer);
                }
                if (q.a) return String(q.a);
                return '';
            };

            // 2) 重建每個解題面板為雙階段
            document.querySelectorAll('.question-explanation').forEach(panel => {
                const id = panel.id || '';
                const q = map[id] || null;
                let pre = '', post = '';
                if (id.indexOf('expl-d') === 0) {
                    // 小組討論：檢查前提示完整句回答；檢查後顯示參考答案＋中文翻譯
                    pre = '💡 請用英文完整回答問題。' + (q && q.zh ? ' ' + q.zh : '');
                    post = (q && (q.reference || q.a)) || '';
                } else if (q) {
                    pre = q.zh ? '📖 ' + q.zh : '💡 請先完成作答，再按「檢查答案」查看解題與參考答案。';
                    let s = '';
                    if (q.explanation) s += q.explanation;
                    const ans = answerLine(q);
                    if (ans) s += '<div style="margin-top:6px;color:#1e7e34;font-weight:600;">✅ 答案：' + ans + '</div>';
                    post = s;
                } else {
                    pre = panel.innerHTML;
                }
                panel.innerHTML = '<div class="qe-pre">' + pre + '</div>' +
                    (post ? '<div class="qe-post">' + post + '</div>' : '');
                panel.classList.remove('show');
            });

            // 3) 小組討論：刪除多餘的參考答案 div 與其燈泡、刪「參考答案」按鈕、補「檢查答案」按鈕
            document.querySelectorAll('.reference-answer').forEach(el => {
                const btn = el.nextElementSibling;
                if (btn && btn.classList && btn.classList.contains('explain-btn')) btn.remove();
                el.remove();
            });
            document.querySelectorAll('.btn-reference').forEach(el => el.remove());
            document.querySelectorAll('.activity-section').forEach(sec => {
                if (!sec.querySelector('[id^="expl-d"]')) return;
                if (sec.querySelector('.btn-check')) return;
                const resetBtn = Array.from(sec.querySelectorAll('.btn-reset'))[0];
                if (!resetBtn) return;
                const checkBtn = document.createElement('button');
                checkBtn.className = 'btn btn-check';
                checkBtn.style.marginRight = '10px';
                checkBtn.innerHTML = '<i class="fas fa-check"></i> 檢查答案';
                checkBtn.addEventListener('click', function () {
                    const sec2 = this.closest('.activity-section');
                    if (sec2) sec2.classList.add('checked');
                });
                resetBtn.parentNode.insertBefore(checkBtn, resetBtn);
            });

            // 4) 長答案輸入：單行 input -> 多行 textarea（可調高度）
            document.querySelectorAll('.answer-input').forEach(inp => {
                if (inp.tagName === 'INPUT') {
                    const ta = document.createElement('textarea');
                    ta.className = inp.className;
                    ta.id = inp.id;
                    ta.placeholder = inp.placeholder || '';
                    ta.rows = 3;
                    ta.value = inp.value || '';
                    ta.style.width = '100%';
                    ta.style.minHeight = '72px';
                    ta.style.boxSizing = 'border-box';
                    inp.parentNode.insertBefore(ta, inp);
                    inp.parentNode.removeChild(inp);
                }
            });

            // 5) 檢查/重設按鈕：切換 checked 狀態（配合 CSS 切換解題面板階段）
            document.querySelectorAll('.btn-check').forEach(btn => {
                btn.addEventListener('click', function () {
                    const sec = this.closest('.activity-section') || this.closest('.reading-sample');
                    if (sec) sec.classList.add('checked');
                });
            });
            document.querySelectorAll('.btn').forEach(btn => {
                const oc = btn.getAttribute('onclick') || '';
                if (oc.indexOf('reset') === 0) {
                    btn.addEventListener('click', function () {
                        const sec = this.closest('.activity-section') || this.closest('.reading-sample');
                        if (sec) {
                            sec.classList.remove('checked');
                            sec.querySelectorAll('.question-explanation').forEach(p => p.classList.remove('show'));
                        }
                    });
                }
            });
        }

            LESSON = data;

        // ==================== 改良 v2（覆寫同名前序函式） ====================
        let currentPlayButton = null;

        function setPlayIcon(button, state) {
            // 說唱播放按鈕：保留音符/唱片圖標，僅切換 playing（旋轉唱片）
            if (button.classList.contains('music-play-btn')) {
                button.classList.toggle('playing', state === 'stop');
                return;
            }
            const isSong = button.classList.contains('song-play-btn');
            const baseIcon = isSong ? 'fa-play' : 'fa-volume-up';
            const icon = state === 'stop' ? 'fa-stop' : baseIcon;
            button.innerHTML = '<i class="fas ' + icon + '"></i><span class="audio-loading"></span>';
        }

        function stopCurrentAudio() {
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
                currentAudio = null;
            }
            if (currentPlayButton) {
                const btn = currentPlayButton;
                btn.classList.remove('playing', 'loading');
                setPlayIcon(btn, 'play');
                currentPlayButton = null;
            }
        }

        function toggleAudioPlay(audioType, button) {
            if (!button || !audioType) return;
            if (button.classList.contains('loading')) return;
            if (currentAudio && currentPlayButton === button) {
                stopCurrentAudio();
                return;
            }
            stopCurrentAudio();
            const audioFile = audioType.replace(/ /g, '_');
            const audioUrl = './audio/' + audioFile + '.mp3';
            currentAudio = new Audio(audioUrl);
            currentPlayButton = button;
            button.classList.add('loading');
            currentAudio.play().then(() => {
                setTimeout(() => {
                    button.classList.remove('loading');
                    button.classList.add('playing');
                    setPlayIcon(button, 'stop');
                }, 500);
                currentAudio.onended = function() {
                    stopCurrentAudio();
                };
            }).catch(e => {
                button.classList.remove('loading');
                currentAudio = null;
                currentPlayButton = null;
                showSilentNotification('音頻文件未找到，請檢查audio資料夾');
            });
        }

        function initializeAudioButtons() {
            const selectors = '.audio-btn, .example-audio-btn, .audio-paragraph-btn, .audio-example-btn, .song-play-btn';
            document.querySelectorAll(selectors).forEach(button => {
                button.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const audioType = this.getAttribute('data-audio');
                    if (!audioType) return;
                    toggleAudioPlay(audioType, this);
                });
            });
        }

        function bindEvents() {
            // 載入保存的學習進度

            const tabs = document.querySelectorAll('.tab');

                tab.addEventListener('click', () => {
                    const targetTab = tab.getAttribute('data-tab');

                    tab.classList.add('active');
                    document.getElementById(targetTab).classList.add('active');

                        resetQuiz();

                    saveProgress();
                });

            // 詞彙卡翻轉功能

            options.forEach(option => {
                option.addEventListener('click', function() {

                option.addEventListener('keydown', function(e) {

                });

                    const section = this.closest('.activity-section');
                    if (section) revealExplanations(section);

            // 回到頂點按鈕
            const backToTop = document.getElementById('backToTop');
            if (backToTop) {
                window.addEventListener('scroll', function() {
