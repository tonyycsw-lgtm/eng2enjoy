        // ==================== 改良 v3（頂部進度條＋雙語片語對虛線對照） ====================
        function escapeRegex(s) {
            return String(s).replace(/[.*+?^$()|[\]\\{}]/g, '\\$&');
        }

        // 英文片語對標記：每組 pairs 以「長片語優先」匹配，組序決定顏色（c0..c5），英文與中文同組同色
        function markEnPairs(text, pairs, escaped) {
            const src = escaped ? esc(String(text)) : String(text);
            if (!pairs || pairs.length === 0) return src;
            const tokens = [];
            let i = 0;
            let result = src;
            const order = pairs.map((p, idx) => idx).sort((a, b) => (pairs[b].en || '').length - (pairs[a].en || '').length);
            order.forEach(idx => {
                const term = escaped ? esc(pairs[idx].en) : pairs[idx].en;
                if (!term) return;
                const re = new RegExp('(^|[^A-Za-z0-9])(' + escapeRegex(term) + ')(?=[^A-Za-z0-9]|$)', 'gi');
                result = result.replace(re, (m, pre, word) => {
                    const ph = '\uE000' + (i++) + '\uE001';
                    tokens.push({ ph, word, cls: 'c' + (idx % 6) });
                    return pre + ph;
                });
            });
            tokens.forEach(t => { result = result.split(t.ph).join('<u class="key-term ' + t.cls + '">' + t.word + '</u>'); });
            return result;
        }

        // 中文片語對標記：直接子串匹配，同組同色
        function markZhPairs(text, pairs, escaped) {
            const src = escaped ? esc(String(text)) : String(text);
            if (!pairs || pairs.length === 0) return src;
            const tokens = [];
            let i = 0;
            let result = src;
            const order = pairs.map((p, idx) => idx).sort((a, b) => (pairs[b].zh || '').length - (pairs[a].zh || '').length);
            order.forEach(idx => {
                const term = escaped ? esc(pairs[idx].zh) : pairs[idx].zh;
                if (!term) return;
                const re = new RegExp(escapeRegex(term), 'g');
                result = result.replace(re, (m) => {
                    const ph = '\uE000' + (i++) + '\uE001';
                    tokens.push({ ph, word: m, cls: 'c' + (idx % 6) });
                    return ph;
                });
            });
            tokens.forEach(t => { result = result.split(t.ph).join('<u class="key-term ' + t.cls + '">' + t.word + '</u>'); });
            return result;
        }

        function updateProgressDisplay() {
            const progressPercent = Math.round((completedPractice / totalPracticeQuestions) * 100);

            // 頂部進度條

            document.getElementById('topProgressText').textContent = '已完成 ' + completedPractice + '/' + totalPracticeQuestions;
            document.getElementById('topCorrectRate').textContent = '正確率 ' + correctRate + '%';

            // 練習頁內進度條

            if (progressBar) progressBar.style.width = progressPercent + '%';
            const progressText = document.getElementById('progress-text');
            if (progressText) progressText.textContent = '進度: ' + completedPractice + '/' + totalPracticeQuestions + ' 已完成';

            // 提示文字
            const nextRecommendation = document.getElementById('nextRecommendation');
            if (nextRecommendation) {
                if (completedPractice === 0) {

        function clearPairActive() {
            document.querySelectorAll('.key-term.pair-active').forEach(u => u.classList.remove('pair-active'));
        }

        // 選擇英國女聲（en-GB）優先，其次 en-GB / 英文女聲 / 英文
        function pickVoice(voices) {
            const list = voices || [];
            const scoreVoice = function(v) {
                let s = 0;
                const name = (v.name || '').toLowerCase();
                if (name.indexOf('microsoft') > -1 || name.indexOf('natural') > -1) s += 3;
                if (/female|woman|samantha|zira|sonia|libby|susan|kate|hazel|serena|martha|mia|aria|jenny|olivia|emma|ava|google uk english female/i.test(name)) s += 2;
                if (name.indexOf('google') > -1) s -= 1;
                return s;
            };
            const pick = function(arr) {
                if (!arr.length) return null;
                return arr.slice().sort(function(a, b) { return scoreVoice(b) - scoreVoice(a); })[0];
            };
            const gb = list.filter(v => v.lang && v.lang.toLowerCase().indexOf('en-gb') === 0);
            if (gb.length) return pick(gb);
            const en = list.filter(v => v.lang && v.lang.toLowerCase().indexOf('en') === 0);
            return pick(en);
        }

        function speakEnglish(text) {
            if (!('speechSynthesis' in window)) return;
            try { if (typeof stopCurrentAudio === 'function') stopCurrentAudio(); } catch (err) {}
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'en-GB';
            u.rate = 0.75;
            let voices = [];
            try { voices = window.speechSynthesis.getVoices() || []; } catch (err) {}
            let spoken = false;
            const doSpeak = function(v) {
                if (spoken) return;
                spoken = true;
                if (v) u.voice = v;
                try { window.speechSynthesis.speak(u); } catch (err) {}
            };
            if (voices.length === 0) {
                // Chrome 首次載入語音可能為異步：等待 voiceschanged 一次，2500ms 後仍未載入則重取語音，避免用默認男聲
                const onVoices = function() {
                    window.speechSynthesis.removeEventListener('voiceschanged', onVoices);
                    const vs = window.speechSynthesis.getVoices() || [];
                    doSpeak(pickVoice(vs));
                };
                try { window.speechSynthesis.addEventListener('voiceschanged', onVoices); } catch (err) {}
                setTimeout(function() { doSpeak(pickVoice(window.speechSynthesis.getVoices() || [])); }, 2500);
            } else {
                doSpeak(pickVoice(voices));
            }
        }

        function setupPairInteractions() {
            // 懸浮聯動：任一側高亮同組英文＋中文
            document.addEventListener('mouseover', function(e) {
                const el = e.target && e.target.closest ? e.target.closest('.key-term') : null;
                if (!el) return;

            });

                if (el) clearPairActive();
            });
            // 點擊英文底線詞（捕獲階段攔截）→ 只朗讀該詞（黃色高亮文字），不讀整句
            document.addEventListener('click', function(e) {
                const el = e.target && e.target.closest ? e.target.closest('.key-term') : null;
                if (!el || el.getAttribute('data-side') !== 'en') return;

            }, true);

        // 英文標記：加 data-pair（組 ID，跨 en/zh 同組）與 data-side="en"
        function markEnPairs(text, pairs, escaped, prefix) {
            const src = escaped ? esc(String(text)) : String(text);
            if (!pairs || pairs.length === 0) return src;
            const tokens = [];
            let i = 0;
            let result = src;
            const order = pairs.map((p, idx) => idx).sort((a, b) => (pairs[b].en || '').length - (pairs[a].en || '').length);
            order.forEach(idx => {
                const term = escaped ? esc(pairs[idx].en) : pairs[idx].en;
                if (!term) return;
                const re = new RegExp('(^|[^A-Za-z0-9])(' + escapeRegex(term) + ')(?=[^A-Za-z0-9]|$)', 'gi');
                result = result.replace(re, (m, pre, word) => {
                    const ph = '' + (i++) + '';
                    tokens.push({ ph, word, cls: 'c' + (idx % 6), pair: (prefix || 'p') + '-' + idx });
                    return pre + ph;
                });
            });
            tokens.forEach(tok => {
                const kk = 'kt-' + String(tok.word).toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '');
                result = result.split(tok.ph).join('<u class="key-term ' + tok.cls + '" data-pair="' + tok.pair + '" data-side="en" data-audio="' + kk + '">' + tok.word + '</u>');
            });
            return result;
        }

        // 中文標記：同組同 data-pair，data-side="zh"
        function markZhPairs(text, pairs, escaped, prefix) {
            const src = escaped ? esc(String(text)) : String(text);
            if (!pairs || pairs.length === 0) return src;
            const tokens = [];
            let i = 0;
            let result = src;
            const order = pairs.map((p, idx) => idx).sort((a, b) => (pairs[b].zh || '').length - (pairs[a].zh || '').length);
            order.forEach(idx => {
                const term = escaped ? esc(pairs[idx].zh) : pairs[idx].zh;
                if (!term) return;
                const re = new RegExp(escapeRegex(term), 'g');
                result = result.replace(re, (m) => {
                    const ph = '' + (i++) + '';
                    tokens.push({ ph, word: m, cls: 'c' + (idx % 6), pair: (prefix || 'p') + '-' + idx });
                    return ph;
                });
            });
            tokens.forEach(tok => { result = result.split(tok.ph).join('<u class="key-term ' + tok.cls + '" data-pair="' + tok.pair + '" data-side="zh">' + tok.word + '</u>'); });
            return result;
        }

        // TTS 朗讀（英國女聲優先，速度 0.7；onEnd 可選回呼，用於還原按鈕圖示）
        // TTS 朗讀前文本淨化：避免瀏覽器把「4B」「6C」等班級名誤讀成「four billion / six hundred」
        function numToWords(n) {
            const ones = ['', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten', 'eleven', 'twelve', 'thirteen', 'fourteen', 'fifteen', 'sixteen', 'seventeen', 'eighteen', 'nineteen'];
            const tens = ['', '', 'twenty', 'thirty', 'forty', 'fifty', 'sixty', 'seventy', 'eighty', 'ninety'];
            n = parseInt(n, 10);
            if (n >= 1 && n < 20) return ones[n];
            if (n < 100) {
                const t = Math.floor(n / 10), o = n % 10;
                return tens[t] + (o ? '-' + ones[o] : '');
            }
            return String(n);
        }
        function ttsPreprocess(text) {
            if (!text) return text;
            return String(text)
                .replace(/\bI'm\b/gi, 'I am')
                .replace(/\bI've\b/gi, 'I have')
                .replace(/\bI'll\b/gi, 'I will')
                .replace(/\byou're\b/gi, 'you are')
                .replace(/\byou've\b/gi, 'you have')
                .replace(/\byou'll\b/gi, 'you will')
                .replace(/\bwe're\b/gi, 'we are')
                .replace(/\bthey're\b/gi, 'they are')
                .replace(/\bhe's\b/gi, 'he is')
                .replace(/\bshe's\b/gi, 'she is')
                .replace(/\bit's\b/gi, 'it is')
                .replace(/\bthat's\b/gi, 'that is')
                .replace(/\bwhat's\b/gi, 'what is')
                .replace(/\bdon't\b/gi, 'do not')
                .replace(/\bdoesn't\b/gi, 'does not')
                .replace(/\bdidn't\b/gi, 'did not')
                .replace(/\bcan't\b/gi, 'cannot')
                .replace(/\bwon't\b/gi, 'will not')
                .replace(/\bisn't\b/gi, 'is not')
                .replace(/\baren't\b/gi, 'are not')
                .replace(/\bwasn't\b/gi, 'was not')
                .replace(/\bweren't\b/gi, 'were not')
                .replace(/\bhasn't\b/gi, 'has not')
                .replace(/\bhaven't\b/gi, 'have not')
                .replace(/\bwouldn't\b/gi, 'would not')
                .replace(/\bcouldn't\b/gi, 'could not')
                .replace(/\bshouldn't\b/gi, 'should not')
                .replace(/\bmustn't\b/gi, 'must not');
        }

        function ttsSafeText(text) {
            if (!text) return text;
            // 班級名「4B」「6C」等：數字轉英文單詞＋空格＋字母，避免引擎誤讀成 four billion / six hundred
            return String(text).replace(/\b(\d{1,2})([A-Z])\b/g, function(m, d, l) {
                return numToWords(d) + ' ' + l;
            });
        }

        function speakEnglish(text, onEnd) {
            if (!('speechSynthesis' in window)) return;
            // 語音引擎初始化（參考 english-reader）：首次朗讀前觸發語音載入，避免用默認語音
            if (!window.__ttsReady) {
                try {
                    const initU = new SpeechSynthesisUtterance(' ');
                    initU.lang = 'en-GB';
                    initU.volume = 0;
                    window.speechSynthesis.speak(initU);
                    window.speechSynthesis.cancel();
                    window.__ttsReady = true;
                } catch (err) {}
            }
            text = ttsSafeText(ttsPreprocess(text));
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'en-GB';
            u.rate = 0.75;
            if (onEnd) {
                u.onend = function() { onEnd(); };
                u.onerror = function() { onEnd(); };
            }
            let voices = [];
            try { voices = window.speechSynthesis.getVoices() || []; } catch (err) {}
            let spoken = false;
            const doSpeak = function(v) {
                if (spoken) return;
                spoken = true;
                if (v) u.voice = v;
                try { window.speechSynthesis.speak(u); } catch (err) {}
            };
            if (voices.length === 0) {
                const onVoices = function() {
                    window.speechSynthesis.removeEventListener('voiceschanged', onVoices);
                    doSpeak(pickVoice(window.speechSynthesis.getVoices() || []));
                };
                try { window.speechSynthesis.addEventListener('voiceschanged', onVoices); } catch (err) {}
                setTimeout(function() { doSpeak(pickVoice(window.speechSynthesis.getVoices() || [])); }, 2500);
            } else {
                doSpeak(pickVoice(voices));
            }
        }

        let currentSongAudio = null;

        // 歌曲按鈕圖示：播放中音樂圖標旋轉（CSS .playing i 動畫）
        function setSongIcon(btn, playing) {
            if (!btn) return;

        // 播放歌曲本地音頻
        function playSongAudio(btn) {
            const src = btn.getAttribute('data-audio');
            if (!src) return;
            stopCurrentAudio();
            const a = new Audio(audioBase() + '/' + src + '.mp3');
            currentSongAudio = a;
            setSongIcon(btn, true);
            a.addEventListener('ended', function() {
                if (currentSongAudio === a) {
                    currentSongAudio = null;
                    setSongIcon(btn, false);
                }
            });
            a.addEventListener('error', function() {
                if (currentSongAudio === a) {
                    currentSongAudio = null;
                    setSongIcon(btn, false);
                }
            });
            a.play().catch(function() {
                if (currentSongAudio === a) {
                    currentSongAudio = null;
                    setSongIcon(btn, false);
                }
            });
        }

        // ==================== 改良 v10（本地音頻優先＋TTS 後備；練習區塊可選；新增詞庫填空/頻率副詞/聆聽/文本類型；分類題泛化；圖片欄位；動態題數） ====================
        let currentLocalAudio = null;

        // ---------- 音頻：先試本地 mp3/wav，缺檔才用瀏覽器 TTS ----------
        // 音頻目錄：依 meta.audioDir（如 audio/Unit1），缺省 audio/（向後兼容）
        function audioBase() {
            return (LESSON && LESSON.meta && LESSON.meta.audioDir) || 'audio';
        }

        function playLocalOrTts(audioKey, ttsText, btn) {
            stopCurrentAudio();
            if (!btn) return;
            btn.classList.add('playing');
            setPlayIcon(btn, 'stop');
            currentPlayButton = btn;
            const restoreBtn = function() {
                if (currentPlayButton === btn) {
                    currentPlayButton = null;
                    btn.classList.remove('playing');
                    setPlayIcon(btn, 'play');
                }
            };
            const useTts = function() {
                currentLocalAudio = null;
                if (ttsText) { speakEnglish(ttsText, restoreBtn); } else { restoreBtn(); }
            };
            if (!audioKey) { useTts(); return; }
            const abase = audioBase();
            const candidates = [abase + '/' + audioKey + '.mp3', abase + '/' + audioKey + '.wav'];
            let idx = 0;
            const tryNext = function() {
                if (idx >= candidates.length) { useTts(); return; }
                const a = new Audio(candidates[idx]);
                idx++;
                currentLocalAudio = a;
                let settled = false;
                a.addEventListener('ended', function() {
                    if (currentLocalAudio === a) { currentLocalAudio = null; restoreBtn(); }
                });
                a.addEventListener('error', function() {
                    if (currentLocalAudio === a) {
                        currentLocalAudio = null;
                        if (!settled) { settled = true; tryNext(); }
                    }
                });
                a.play().catch(function() {
                    if (currentLocalAudio === a) {
                        currentLocalAudio = null;
                        if (!settled) { settled = true; tryNext(); }
                    }
                });
            };
            tryNext();
        }

                const sb = document.querySelector('.song-play-btn');

            }
            if (currentLocalAudio) {
                try { currentLocalAudio.pause(); } catch (err) {}
                currentLocalAudio = null;
            }
            if (!keepSeq && currentPlayButton) {

                btn.classList.remove('playing');

        function renderBankBlock(blockKey, block) {
            let html = '<div class="activity-section" data-bank-block="' + blockKey + '">';
            html += '<h4 class="activity-title"><i class="fas ' + block.icon + '"></i> ' + esc(block.title) + '</h4>';

            if (block.scale && block.scale.length) {
                html += '<div style="display: flex; justify-content: space-between; max-width: 540px; margin: 10px 0 18px; padding: 8px 14px; background: #eef2f7; border-radius: 8px;">';
                block.scale.forEach(s => { html += '<span><strong>' + esc(s) + '</strong></span>'; });
                html += '</div>';
            }
            if (block.bank && block.bank.length) {
                html += '<div style="display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; padding: 10px; background: #fff8e1; border-radius: 8px;">';
                block.bank.forEach(w => { html += '<span style="background: #fff; border: 1px solid #e0c37c; padding: 4px 12px; border-radius: 14px;">' + esc(w) + '</span>'; });
                html += '</div>';
            }
            html += '<div class="fill-blank-container">';
            block.items.forEach((it, iti) => {
                const itId = it.id || (iti + 1);
                html += '<div class="fill-blank-item"><div class="blank-sentence">';
                html += esc(it.before || it.prompt);
                html += '<select class="bank-select" data-item="' + itId + '" style="margin: 0 6px; padding: 6px 8px; border-radius: 6px; border: 1px solid #bbb; font-size: 1rem;">';
                html += '<option value="">______</option>';
                (block.bank || []).forEach(w => { html += '<option value="' + esc(w) + '">' + esc(w) + '</option>'; });
                html += '</select>';
                html += esc(it.after || '');
                const explText = it.explanation || (function () {
                    const zhM = String(it.prompt || '').match(/（([^（）]+)）/g);
                    const zh = zhM ? zhM[zhM.length - 1].slice(1, -1) : '';
                    return '答案：' + (it.answer || '') + (zh ? '（' + zh + '）' : '');
                })();
                html += '</div>' + explainBtnHtml('expl-' + itId) + explanationDivHtml('expl-' + itId, explText) + '</div>';
            });
            html += '</div>';
            html += '<div class="feedback" id="' + blockKey + 'Feedback"></div>';
            html += '<button class="btn btn-check" onclick="checkBankFill(\'' + blockKey + '\')" aria-label="檢查' + esc(block.title) + '答案"><i class="fas fa-check"></i> 檢查答案</button>';
            html += '<button class="btn btn-reset" onclick="resetBankFill(\'' + blockKey + '\')" aria-label="重設' + esc(block.title) + '"><i class="fas fa-redo"></i> 重新開始</button>';
            html += '</div>';
            return html;
        }

        // ---------- 答案收集：各區塊可選 ----------
        function populateAnswers() {
            const p = LESSON.practice || {};
            answers = {};
            if (p.readingQA) p.readingQA.questions.forEach((q, qi) => {
                answers['q4-' + (q.id || (qi + 1))] = { type: 'sentence', answer: q.answer || q.a, variations: q.variations || [] };
            });
            if (p.sentencePattern) p.sentencePattern.items.forEach(it => {
                answers[it.id] = { type: 'word', answer: it.answer };
            });
            if (p.comparative) p.comparative.items.forEach(it => {
                answers[it.id] = { type: 'word', answer: it.answer };
            });
            const song = LESSON.song;
            if (song && song.questions) song.questions.forEach(q => {
                answers[q.id] = { type: q.type, answer: q.answer, variations: q.variations || [] };
            });

            factOpinionAnswers = (p.factOpinion && p.factOpinion.answers) ? Object.assign({}, p.factOpinion.answers) : {};
            vocabMatchingAnswers = (p.vocabMatching && p.vocabMatching.answerMap) ? Object.assign({}, p.vocabMatching.answerMap) : {};
            readingCompAnswers = {};
            if (p.readingComp) p.readingComp.questions.forEach(q => { readingCompAnswers[q.id] = q.answer; });
            gadgetCategories = {};
            if (p.gadgetSorting) p.gadgetSorting.gadgets.forEach(g => { gadgetCategories[g.name] = g.category; });
            wordBankAnswers = {};
            if (p.wordBank) p.wordBank.items.forEach(it => { wordBankAnswers[it.id] = it.answer; });
            frequencyAnswers = {};
            if (p.frequency) p.frequency.items.forEach(it => { frequencyAnswers[it.id] = it.answer; });
            listeningAnswers = {};
            const lis = LESSON.listening;
            if (lis && lis.questions) lis.questions.forEach(q => { listeningAnswers[q.id] = q.answer; });
            textTypeAnswers = {};
            const tt = LESSON.textType;
            if (tt && tt.questions) tt.questions.forEach(q => { textTypeAnswers[q.id] = q.answer; });
            quizAnswers = {};
            if (LESSON.quiz) LESSON.quiz.sections.forEach(sec => {
                if (sec.type === 'choice') {
                    sec.questions.forEach(q => { quizAnswers[sec.keyPrefix + q.id] = q.answer; });
                } else if (sec.type === 'blank') {
                    sec.questions.forEach(q => { quizAnswers[q.id] = q.answer; });

                }
            });

        // ---------- 檢查/重設：動態題數（配合各單元題數不同） ----------
        function checkReadingComp() {
            const block = LESSON.practice.readingComp;
            if (!block) return;
            const feedback = document.getElementById('readingCompFeedback');
            let correctCount = 0, answeredCount = 0;
            block.questions.forEach(q => {
                const sel = document.querySelector('.option.selected[data-question="' + q.id + '"]');
                if (!sel) {
                    const correctOption = document.querySelector('.option[data-question="' + q.id + '"][data-answer="' + q.answer + '"]');
                    if (correctOption) correctOption.classList.add('correct-unanswered');
                    return;
                }
                answeredCount++;
                if (sel.getAttribute('data-answer') === q.answer) { markElementCorrect(sel); correctCount++; }

            });
            feedback.style.display = 'block';

                feedback.innerHTML = '❌ 請先選擇答案！';

                feedback.className = 'feedback incorrect';

            } else if (correctCount === block.questions.length) {

        function checkReadingQA() {
            const block = LESSON.practice.readingQA;
            if (!block) return;
            let allCorrect = true;
            block.questions.forEach((q, qi) => {
                const qid = q.id || (qi + 1);
                const input = document.getElementById('q4-' + qid + '-answer');
                const result = document.getElementById('q4-' + qid + '-result');
                const answerData = answers['q4-' + qid];
                if (!input || !answerData) return;
                const userAnswer = input.value.trim().toLowerCase();
                clearElementMark(input);
                let correct = false;
                if (answerData.type === 'sentence') {
                    const normalizedUserAnswer = userAnswer.replace(/[.?]$/, '');
                    const normalizedCorrectAnswer = answerData.answer.toLowerCase().replace(/[.?]$/, '');
                    correct = normalizedUserAnswer === normalizedCorrectAnswer;
                    if (!correct && answerData.variations) {
                        for (const variation of answerData.variations) {
                            if (normalizedUserAnswer === variation.toLowerCase().replace(/[.?]$/, '')) { correct = true; break; }
                        }
                    }
                }
                if (correct) {
                    result.textContent = '✅ 正確！';
                    result.className = 'result correct';
                    markElementCorrect(input);
                } else {
                    result.textContent = '❌ 不正確，參考答案: ' + answerData.answer;
                    result.className = 'result incorrect';
                    markElementIncorrect(input);
                    allCorrect = false;
                }
                result.style.display = 'block';
            });
            if (allCorrect && !practiceScores.readingQA) {
                completedPractice++; correctAnswers++; practiceScores.readingQA = 1; updateProgressDisplay();
            }
        }

            });
            const feedback = document.getElementById('textTypeFeedback');
            if (feedback) feedback.style.display = 'none';
            if (practiceScores.textType) {
                completedPractice--; correctAnswers--; delete practiceScores.textType; updateProgressDisplay();
            }
        }

        // ---------- 分類拖拽：泛化 zones ----------
        function initializeDragAndDrop() {
            const dragItems = document.querySelectorAll('.drag-item[data-gadget]');
            dragItems.forEach(item => {
                item.setAttribute('draggable', 'true');
                item.addEventListener('dragstart', function(e) {
                    this.classList.add('dragging');
                    e.dataTransfer.setData('text/plain', JSON.stringify({
                        gadget: this.getAttribute('data-gadget'),
                        category: this.getAttribute('data-category'),
                        elementId: this.id || 'drag-' + Date.now()
                    }));
                });
                item.addEventListener('dragend', function() { this.classList.remove('dragging'); });
            });
            document.querySelectorAll('.drop-zone[data-zone]').forEach(zone => {
                zone.addEventListener('dragover', function(e) { e.preventDefault(); this.style.backgroundColor = '#dce5f0'; });
                zone.addEventListener('dragleave', function() { this.style.backgroundColor = '#eef2f7'; });
                zone.addEventListener('drop', function(e) {
                    e.preventDefault();
                    this.style.backgroundColor = '#eef2f7';
                    try {
                        const data = JSON.parse(e.dataTransfer.getData('text/plain'));
                        handleDrop(data, this.getAttribute('data-zone'));
                    } catch (error) {
                        console.error('拖拽數據解析錯誤:', error);
                    }
                });
            });
        }

        function handleDrop(data, targetZone) {
            const gadget = data.gadget;
            dragHistory.push({ gadget: gadget, fromCategory: getCurrentCategory(gadget), toCategory: targetZone, timestamp: Date.now() });
            document.querySelectorAll('.dropped-item').forEach(item => {
                if (item.getAttribute('data-gadget') === gadget) item.remove();
            });
            const itemsContainer = document.getElementById('items-' + targetZone);
            if (!itemsContainer) return;
            const droppedItem = document.createElement('div');
            droppedItem.className = 'dropped-item';
            droppedItem.textContent = gadget;
            droppedItem.setAttribute('data-gadget', gadget);
            droppedItem.setAttribute('data-category', targetZone);
            itemsContainer.appendChild(droppedItem);
            const dragItem = document.querySelector('.drag-item[data-gadget="' + gadget.replace(/"/g, '\\"') + '"]');
            if (dragItem) { dragItem.style.opacity = '0.3'; dragItem.style.pointerEvents = 'none'; }
        }

        function getCurrentCategory(gadget) {
            const item = document.querySelector('.dropped-item[data-gadget="' + gadget.replace(/"/g, '\\"') + '"]');
            return item ? item.getAttribute('data-category') : 'none';
        }

        function checkGadgetSorting() {
            const block = LESSON.practice.gadgetSorting;
            if (!block) return;
            const feedback = document.getElementById('gadgetSortingFeedback');
            let correctCount = 0;
            const totalGadgets = block.gadgets.length;
            block.gadgets.forEach(g => {
                const dragItem = document.querySelector('.drag-item[data-gadget="' + g.name.replace(/"/g, '\\"') + '"]');
                const placed = document.querySelector('.dropped-item[data-gadget="' + g.name.replace(/"/g, '\\"') + '"]');
                if (placed && placed.getAttribute('data-category') === g.category) {
                    markElementCorrect(dragItem); markElementCorrect(placed); correctCount++;
                } else if (placed) {
                    markElementIncorrect(dragItem); markElementIncorrect(placed);
                } else {
                    markElementIncorrect(dragItem);
                }
            });
            feedback.style.display = 'block';
            if (correctCount === totalGadgets) {
                feedback.className = 'feedback correct';
                feedback.innerHTML = '✅ 太棒了！分類完全正確！';
                if (!practiceScores.gadgetSorting) {
                    completedPractice++; correctAnswers++; practiceScores.gadgetSorting = 1; updateProgressDisplay();
                }
            } else {
                feedback.className = 'feedback incorrect';
                feedback.innerHTML = '❌ 正確分類: ' + correctCount + '/' + totalGadgets;
            }
        }

        function undoLastDrag() {
            if (!dragHistory.length) { showSilentNotification('沒有可以返回的操作'); return; }
            const lastAction = dragHistory.pop();
            const gadget = lastAction.gadget;
            const item = document.querySelector('.dropped-item[data-gadget="' + gadget.replace(/"/g, '\\"') + '"]');
            if (item) item.remove();
            const dragItem = document.querySelector('.drag-item[data-gadget="' + gadget.replace(/"/g, '\\"') + '"]');

        // ---------- 薄弱環節分析（依資料存在與否） ----------
        function analyzeWeaknesses() {
            const weaknesses = [];
            const p = LESSON.practice || {};
            const typeLabels = {
                factOpinion: '事實與觀點辨析練習',
                vocabMatching: '詞彙匹配練習',
                readingComp: '閱讀理解選擇題',
                readingQA: '閱讀理解問答題',
                sentencePattern: '句型運用練習',
                comparative: '比較級與最高級練習',
                gadgetSorting: '分類拖拽練習',
                wordBank: '詞庫填空練習',
                frequency: '頻率副詞練習'
            };
            const scoreKeys = {
                factOpinion: 'factOpinion',
                vocabMatching: 'vocabMatchingComplete',
                readingComp: 'readingComp',
                readingQA: 'readingQA',
                sentencePattern: 'sentencePattern',
                comparative: 'comparative',
                gadgetSorting: 'gadgetSorting',
                wordBank: 'wordBank',
                frequency: 'frequency'
            };
            Object.keys(typeLabels).forEach(k => {
                if (p[k] && !practiceScores[scoreKeys[k]]) weaknesses.push(typeLabels[k]);
            });
            if (LESSON.listening && LESSON.listening.questions && !practiceScores.listening) weaknesses.push('聆聽練習');
            if (LESSON.textType && LESSON.textType.questions && !practiceScores.textType) weaknesses.push('文本理解練習');
            return weaknesses.slice(0, 3);
        }

        // ==================== 改良 v11（單元母版：下拉選單 + URL 參數載入） ====================
        // 載入優先序：URL ?unit= 參數 > 上次選擇（localStorage）> 預設 Data/Unit5.json
        function normalizeUnitPath(f) {
            if (!f) return 'Data/4A/Unit5.json';
            // 兼容舊路徑（Book 4A 上學期：Data/UnitX.json、UnitX.json、Data/4A/UnitX.json）
            if (f.indexOf('Data/4A/') === 0 || f.indexOf('Data/4B/') === 0) return f;
            let m = f.match(/^(?:Data\/)?(Unit\d+\.json)$/);
            if (m) return 'Data/4A/' + m[1];
            return f;                            // 已是完整路徑（Data/4B/Unit1.json 等）
        }
        function getRequestedUnitFile() {
            const params = new URLSearchParams(window.location.search);
            const fromUrl = params.get('unit');
            if (fromUrl) {
                const p = normalizeUnitPath(fromUrl);
                try { localStorage.setItem('ete_unit_file', p); } catch (e) {}
                return p;
            }
            try {
                const saved = localStorage.getItem('ete_unit_file');
                if (saved) return normalizeUnitPath(saved);
            } catch (e) {}
            return 'Data/4A/Unit5.json';
        }

        async function initApp() {
            const unitFile = getRequestedUnitFile();
            let data;
            try {

                data = await res.json();
            } catch (err) {
                document.getElementById('loadError').style.display = 'block';
                console.error('無法載入 ' + unitFile + ':', err);
                return;
            }

            LESSON = data;

            const sel = document.getElementById('unitSelect');
            if (sel) sel.value = unitFile;

            applyMeta();
            renderFlashcards();
            renderReading();
            renderPractice();
            renderQuiz();
            renderLearningTab();
            populateAnswers();
            bindEvents();
            showPage(1);
        }

        function initUnitSelector() {
            const sel = document.getElementById('unitSelect');
            if (!sel) return;
            sel.addEventListener('change', function () {
                const f = this.value;
                if (!f) return;
                try { localStorage.setItem('ete_unit_file', f); } catch (e) {}
                const url = new URL(window.location.href);
                url.searchParams.set('unit', f);
                window.location.href = url.toString();
            });

        document.addEventListener('DOMContentLoaded', initUnitSelector);

        // ==================== 改良 v12（Text Type 播放＋翻譯；聆聽波浪＋廣播稿彈窗；輸入框與解題 CSS 已由 v12 樣式處理） ====================
        const readerState = {
            audio: null,          // 本地 Audio 物件
            segments: [],         // [{en, zh}]
            segStarts: [],        // 每句起始比例（0-1）
            currentIdx: -1,
            playing: false,
            timer: null,
            popupOpen: false,
            showZh: true,
            minimized: false,
            userWidth: null,
            userHeight: null
        };

        function splitSentences(text) {
            const t = stripHtml(text || '');
            const parts = t.split(/(?<=[.!?])\s+/);
            return parts.map(p => p.trim()).filter(Boolean);
        }

        function buildSegments(script) {
            if (script && script.segments && script.segments.length) {
                return script.segments.map(s => ({ en: stripHtml(s.en || ''), zh: s.zh || '' }));
            }
            return splitSentences(script && script.text ? script.text : '').map(p => ({ en: p, zh: '' }));
        }

        // 音節估算（英文朗讀時長與音節數更相關）
        function estSyllables(s) {
            const t = String(s || '').toLowerCase();
            const grp = t.match(/[aeiouy]+/g);
            let n = grp ? grp.length : 0;
            return Math.max(n, 1);
        }
        function computeSegStarts() {
            const lens = readerState.segments.map(s => estSyllables(s.en));
            const total = lens.reduce((a, b) => a + b, 0) || 1;
            let acc = 0;
            readerState.segStarts = lens.map(l => { const s = acc / total; acc += l; return s; });
        }

        // 用 Web Audio 分析音頻靜音段：音節估算句首 ± 窗內，選「偏差小且停頓長」的停頓中點作為精確邊界（0-1）
        function analyzeSegmentTimes(src, n, estStarts) {
            return new Promise(function(resolve) {
                if (!n || n < 2) { resolve(null); return; }
                let ACtx = null;
                try { ACtx = window.AudioContext || window.webkitAudioContext; } catch (e) {}
                if (!ACtx) { resolve(null); return; }
                let ctx = null;
                try { ctx = new ACtx(); } catch (e) { resolve(null); return; }
                fetch(src).then(function(r) { return r.arrayBuffer(); })
                .then(function(buf) { return ctx.decodeAudioData(buf); })
                .then(function(ab) {
                    const ch = ab.getChannelData(0);
                    const sr = ab.sampleRate;
                    const dur = ab.duration;
                    const win = Math.max(1, Math.floor(sr * 0.01)); // 10ms 窗
                    const energies = [];
                    for (let i = 0; i < ch.length; i += win) {
                        let s = 0;
                        const end = Math.min(i + win, ch.length);
                        for (let j = i; j < end; j++) s += ch[j] * ch[j];
                        energies.push(s / (end - i));
                    }
                    let maxE = 0;
                    for (let k = 0; k < energies.length; k++) if (energies[k] > maxE) maxE = energies[k];
                    const thr = Math.max(maxE * 0.04, 1e-8);
                    const silences = [];
                    let i = 0;
                    while (i < energies.length) {
                        if (energies[i] <= thr) {
                            let j = i;
                            while (j < energies.length && energies[j] <= thr) j++;
                            const lenMs = (j - i) * 10;
                            if (lenMs >= 90) silences.push({ start: i * 10 / 1000, end: j * 10 / 1000, len: lenMs });
                            i = j;
                        } else i++;
                    }
                    // 順序配對：每個估算句首在 ±窗內，選 cost=|中點-估算|-0.002×停頓長度 最小者（停頓中點＝前句已播完）
                    const est = estStarts && estStarts.length === n ? estStarts : null;
                    const bounds = [0];
                    if (est) {
                        for (let k = 1; k < n; k++) {
                            const eSec = est[k] * dur;
                            let best = null, bestC = null;
                            for (let s = 0; s < silences.length; s++) {
                                const mid = (silences[s].start + silences[s].end) / 2;
                                if (mid <= bounds[bounds.length - 1] * dur + 0.6) continue;
                                if (mid < eSec - 3.0 || mid > eSec + 4.0) continue;
                                const c = Math.abs(mid - eSec) - 0.002 * silences[s].len;
                                if (bestC === null || c < bestC) { best = mid; bestC = c; }
                            }
                            bounds.push(best !== null ? best / dur : est[k]);
                        }
                    } else {
                        // 無估算時退回：取最長 n-1 個停頓中點
                        silences.sort(function(a, b) { return b.len - a.len; });
                        bounds.push.apply(bounds, silences.slice(0, n - 1).map(function(s) { return ((s.start + s.end) / 2) / dur; }).sort(function(a, b) { return a - b; }));
                    }
                    // 強制遞增去重，不足則補估算
                    const out = [0];
                    for (let k = 1; k < bounds.length && out.length < n; k++) {
                        if (bounds[k] > out[out.length - 1] + 0.6 / dur) out.push(bounds[k]);
                    }
                    if (out.length < n && est) {
                        for (let k = 1; k < n && out.length < n; k++) {
                            if (est[k] > out[out.length - 1] + 0.4 / dur) out.push(est[k]);
                        }
                    }
                    if (out.length === n) {
                        resolve(out);
                    } else {
                        resolve(null);
                    }
                    try { ctx.close(); } catch (e) {}
                }).catch(function() { resolve(null); });
            });
        }

        function setWaveOn(on) {
            const w = document.getElementById('listeningWave');
            if (w) w.classList.toggle('paused', !on);
            const w2 = document.getElementById('readerWave');
            if (w2) w2.classList.toggle('paused', !on);
        }

        function updateHighlight(idx) {
            readerState.currentIdx = idx;
            document.querySelectorAll('.reader-sentence').forEach(s => {
                const i = parseInt(s.getAttribute('data-idx'), 10);
                s.classList.toggle('playing', i === idx);
                if (i === idx && idx >= 0) {
                    const cont = document.querySelector('.reader-content');
                    if (cont) {
                        const top = s.offsetTop - cont.offsetTop - 10;
                        if (top < cont.scrollTop) { cont.scrollTop = Math.max(0, top); }
                        else if (top + s.offsetHeight + 10 > cont.scrollTop + cont.clientHeight) {
                            cont.scrollTop = Math.max(0, top + s.offsetHeight + 10 - cont.clientHeight);
                        }
                    }
                }
            });
        }

        function updateReaderPlayBtn() {
            const b = document.getElementById('readerPlayBtn');
            if (!b) return;
            b.innerHTML = readerState.playing ? '<i class="fas fa-pause"></i>' : '<i class="fas fa-play"></i>';
            b.classList.toggle('active', readerState.playing);
        }

        function stopReadingPlayback() {
            if (readerState.timer) { clearInterval(readerState.timer); readerState.timer = null; }
            if (readerState.audio) { try { readerState.audio.pause(); } catch (e) {} readerState.audio = null; }
            try { window.speechSynthesis.cancel(); } catch (e) {}
            readerState.playing = false;
            setWaveOn(false);
            updateHighlight(-1);
            updateReaderPlayBtn();
            const main = document.querySelector('.listening-play-btn');
            if (main) { main.classList.remove('playing'); main.innerHTML = '<i class="fas fa-play"></i>'; }
        }

        function startLocalPlayback(a) {
            stopReadingPlayback();
            readerState.audio = a;
            readerState.playing = true;
            setWaveOn(true);
            updateReaderPlayBtn();
            const main = document.querySelector('.listening-play-btn');
            if (main) { main.classList.add('playing'); main.innerHTML = '<i class="fas fa-pause"></i>'; }
            computeSegStarts();
            // 精確句子時間（Web Audio 靜音分析 + 估算配對），完成後無縫切換
            if (readerState.segments.length > 1) {
                analyzeSegmentTimes(a.src || a.currentSrc, readerState.segments.length, readerState.segStarts).then(function(starts) {
                    if (starts && starts.length === readerState.segments.length && readerState.audio === a) {
                        readerState.segStarts = starts;
                    }
                });
            }
            a.play().catch(function() { stopReadingPlayback(); });
            a.addEventListener('ended', function() { if (readerState.audio === a) stopReadingPlayback(); });
            a.addEventListener('error', function() { if (readerState.audio === a) stopReadingPlayback(); });
            readerState.timer = setInterval(function() {
                if (!readerState.audio || readerState.audio.paused) return;
                const dur = readerState.audio.duration || 1;
                const t = readerState.audio.currentTime;
                let idx = 0;
                for (let k = 0; k < readerState.segStarts.length; k++) {
                    if (t / dur >= readerState.segStarts[k]) idx = k;
                }
                updateHighlight(idx);
            }, 200);
        }

        // 整段播放：本地音頻優先（audioDir + key），失敗改用瀏覽器 TTS 全文
        function playFullLocal() {
            stopCurrentAudio();
            const script = (LESSON.listening && LESSON.listening.script) || {};
            readerState.segments = buildSegments(script);
            if (!readerState.segments.length) return;
            computeSegStarts();
            const base = audioBase();
            const keys = script.audio ? [base + '/' + script.audio + '.mp3', base + '/' + script.audio + '.wav'] : [];
            let i = 0;
            const tryNext = function() {
                if (i >= keys.length) {
                    readerState.playing = true;
                    setWaveOn(true);
                    updateReaderPlayBtn();
                    const main = document.querySelector('.listening-play-btn');
                    if (main) { main.classList.add('playing'); main.innerHTML = '<i class="fas fa-pause"></i>'; }
                    speakEnglish(stripHtml(script.text || ''), function() {
                        if (readerState.playing && !readerState.audio) stopReadingPlayback();
                    });
                    return;
                }
                const a = new Audio(keys[i]);
                i++;
                a.addEventListener('error', function() { tryNext(); }, { once: true });
                a.addEventListener('canplaythrough', function() { startLocalPlayback(a); }, { once: true });
                a.load();
            };
            tryNext();
        }

        // 逐句播放：先試本地逐句 mp3（{audio}-sN.mp3），缺檔才 TTS
        function playSegmentTTS(idx) {
            if (!readerState.segments.length || idx < 0 || idx >= readerState.segments.length) return;
            stopCurrentAudio();
            readerState.playing = true;
            setWaveOn(true);
            updateReaderPlayBtn();
            const main = document.querySelector('.listening-play-btn');
            if (main) { main.classList.add('playing'); main.innerHTML = '<i class="fas fa-pause"></i>'; }
            updateHighlight(idx);
            const seg = readerState.segments[idx];
            const script = (LESSON.listening && LESSON.listening.script) || {};
            const key = script.audio ? audioBase() + '/' + script.audio + '-s' + (idx + 1) + '.mp3' : '';
            if (key) {
                const a = new Audio(key);
                let fellBack = false;
                a.addEventListener('error', function() {
                    if (fellBack || !readerState.playing) return;
                    fellBack = true;
                    speakEnglish(seg.en, function() {
                        if (readerState.playing && !readerState.audio) stopReadingPlayback();
                    });
                }, { once: true });
                a.addEventListener('canplaythrough', function() {
                    if (fellBack) return;
                    stopReadingPlayback();
                    readerState.audio = a;
                    readerState.playing = true;
                    setWaveOn(true);
                    updateReaderPlayBtn();
                    const main = document.querySelector('.listening-play-btn');
                    if (main) { main.classList.add('playing'); main.innerHTML = '<i class="fas fa-pause"></i>'; }
                    updateHighlight(idx);
                    a.play().catch(function() { stopReadingPlayback(); });
                    a.addEventListener('ended', function() { if (readerState.audio === a) stopReadingPlayback(); }, { once: true });
                    a.addEventListener('error', function() { if (readerState.audio === a) stopReadingPlayback(); }, { once: true });
                }, { once: true });
                a.load();
            } else {
                speakEnglish(seg.en, function() {
                    if (readerState.playing && !readerState.audio) stopReadingPlayback();
                });
            }
        }

        function listeningPlayToggle() {
            if (readerState.playing) { stopReadingPlayback(); return; }
            playFullLocal();
        }

        // ---------- 聆聽廣播稿彈窗 ----------
        function ensureReaderPopup() {
            let pop = document.getElementById('readerPopup');
            if (pop) return pop;
            pop = document.createElement('div');
            pop.className = 'reader-popup';
            pop.id = 'readerPopup';
            pop.style.display = 'none';
            pop.innerHTML =
                '<div class="reader-header" id="readerHeader">' +
                '<h4><i class="fas fa-headphones"></i> 聆聽廣播稿</h4>' +
                '<div class="reader-header-btns">' +
                '<button id="readerTransBtn" title="中英對照"><i class="fas fa-language"></i></button>' +
                '<button id="readerMinBtn" title="最小化" style="visibility:hidden"><i class="fas fa-minus"></i></button>' +
                '<button id="readerCloseBtn" title="關閉"><i class="fas fa-times"></i></button>' +
                '</div>' +
                '<div class="mini-icon"><i class="fas fa-headphones"></i></div>' +
                '</div>' +
                '<div class="reader-controls-wrap">' +
                '<div class="reader-controls">' +
                '<button class="reader-ctrl-btn" id="readerPrevBtn" title="上一句"><i class="fas fa-backward-step"></i></button>' +
                '<button class="reader-ctrl-btn primary" id="readerPlayBtn" title="播放/暫停"><i class="fas fa-play"></i></button>' +
                '<button class="reader-ctrl-btn" id="readerNextBtn" title="下一句"><i class="fas fa-forward-step"></i></button>' +
                '<span class="wave-bars paused" id="readerWave"><span></span><span></span><span></span><span></span><span></span></span>' +
                '</div></div>' +
                '<div class="reader-content">' +
                '<div class="reader-script" id="readerScript"></div>' +
                '</div>' +
                '<div class="reader-resize" id="readerResize"></div>';
            document.body.appendChild(pop);

            // 拖動
            const header = pop.querySelector('.reader-header');
            let isDragging = false, dX = 0, dY = 0, pX = 0, pY = 0;
            header.addEventListener('pointerdown', function(e) {
                if (e.target.closest('.reader-header-btns')) return;
                isDragging = true;
                try { header.setPointerCapture(e.pointerId); } catch (err) {}
                const r = pop.getBoundingClientRect();
                dX = e.clientX - r.left; dY = e.clientY - r.top;
                pX = r.left; pY = r.top;
                e.preventDefault();
            });
            document.addEventListener('pointermove', function(e) {
                if (!isDragging) return;
                let nl = e.clientX - dX, nt = e.clientY - dY;
                nl = Math.max(0, Math.min(window.innerWidth - pop.offsetWidth, nl));
                nt = Math.max(0, Math.min(window.innerHeight - pop.offsetHeight, nt));
                pop.style.left = nl + 'px'; pop.style.top = nt + 'px';
                pop.style.right = 'auto'; pop.style.bottom = 'auto';
            });
            document.addEventListener('pointerup', function() { isDragging = false; saveReaderState(); });
            document.addEventListener('pointercancel', function() { isDragging = false; });

            // 縮放
            const rz = pop.querySelector('.reader-resize');
            let isResizing = false, sW = 0, sH = 0, sX = 0, sY = 0;
            rz.addEventListener('pointerdown', function(e) {
                isResizing = true;
                try { rz.setPointerCapture(e.pointerId); } catch (err) {}
                sW = pop.offsetWidth; sH = pop.offsetHeight; sX = e.clientX; sY = e.clientY;
                e.preventDefault(); e.stopPropagation();
            });
            document.addEventListener('pointermove', function(e) {
                if (!isResizing) return;
                pop.style.width = Math.min(560, Math.max(300, sW + e.clientX - sX)) + 'px';
                pop.style.height = Math.min(520, Math.max(220, sH + e.clientY - sY)) + 'px';
            });
            document.addEventListener('pointerup', function() { if (isResizing) { isResizing = false; saveReaderState(); } });

            // 按鈕
            pop.querySelector('#readerPlayBtn').addEventListener('click', function(e) {
                e.stopPropagation();
                if (readerState.playing) { stopReadingPlayback(); return; }
                if (readerState.currentIdx > 0 && !readerState.audio) {
                    playSegmentTTS(readerState.currentIdx);
                } else {
                    playFullLocal();
                }
            });
            pop.querySelector('#readerPrevBtn').addEventListener('click', function(e) {
                e.stopPropagation();
                const idx = Math.max(0, (readerState.currentIdx < 0 ? 0 : readerState.currentIdx) - 1);
                playSegmentTTS(idx);
            });
            pop.querySelector('#readerNextBtn').addEventListener('click', function(e) {
                e.stopPropagation();
                const idx = (readerState.currentIdx < 0 ? 0 : readerState.currentIdx) + 1;
                if (idx >= readerState.segments.length) { stopReadingPlayback(); return; }
                playSegmentTTS(idx);
            });
            pop.querySelector('#readerTransBtn').addEventListener('click', function(e) {
                e.stopPropagation();
                readerState.showZh = !readerState.showZh;
                pop.querySelectorAll('.rs-zh').forEach(z => z.classList.toggle('hidden-zh', !readerState.showZh));
                this.style.background = readerState.showZh ? '' : 'rgba(255,255,255,0.5)';
            });
            pop.querySelector('#readerMinBtn').addEventListener('click', function(e) {
                e.stopPropagation();
                toggleReaderMinimize(pop);
            });
            pop.querySelector('#readerCloseBtn').addEventListener('click', function(e) {
                e.stopPropagation();
                stopReadingPlayback();
                pop.style.display = 'none';
                readerState.popupOpen = false;
            });
            pop.addEventListener('click', function(e) {
                if (readerState.minimized && !e.target.closest('button')) toggleReaderMinimize(pop);
            });
            // 點句子播放該句
            pop.querySelector('#readerScript').addEventListener('click', function(e) {
                const s = e.target.closest('.reader-sentence');
                if (!s) return;
                playSegmentTTS(parseInt(s.getAttribute('data-idx'), 10));
            });
            loadReaderState(pop);
            return pop;
        }

        function toggleReaderMinimize(pop) {
            readerState.minimized = !readerState.minimized;
            pop.classList.toggle('minimized', readerState.minimized);
            const b = pop.querySelector('#readerMinBtn');
            if (b) b.innerHTML = readerState.minimized ? '<i class="fas fa-plus"></i>' : '<i class="fas fa-minus"></i>';
            if (!readerState.minimized && readerState.userWidth) pop.style.width = readerState.userWidth;
            if (!readerState.minimized && readerState.userHeight) pop.style.height = readerState.userHeight;
            saveReaderState();
        }

        function saveReaderState() {
            const pop = document.getElementById('readerPopup');
            if (!pop) return;
            try {
                localStorage.setItem('ete_reader_state', JSON.stringify({
                    left: pop.style.left, top: pop.style.top,
                    width: pop.style.width, height: pop.style.height,
                    showZh: readerState.showZh
                }));
            } catch (e) {}
        }

        function loadReaderState(pop) {
            try {
                const st = JSON.parse(localStorage.getItem('ete_reader_state') || 'null');
                if (st) {
                    if (st.left && st.top) { pop.style.left = st.left; pop.style.top = st.top; pop.style.right = 'auto'; pop.style.bottom = 'auto'; }
                    if (st.width) { pop.style.width = st.width; readerState.userWidth = st.width; }
                    if (st.height) { pop.style.height = st.height; readerState.userHeight = st.height; }
                    if (st.showZh !== undefined) readerState.showZh = st.showZh;
                }
            } catch (e) {}
        }

        function openListeningReader() {
            const script = (LESSON.listening && LESSON.listening.script) || {};
            readerState.segments = buildSegments(script);
            const pop = ensureReaderPopup();
            const listEl = pop.querySelector('#readerScript');
            listEl.innerHTML = '';
            readerState.segments.forEach((s, i) => {
                const div = document.createElement('div');
                div.className = 'reader-sentence';
                div.setAttribute('data-idx', i);
                div.innerHTML = '<div class="rs-en">' + (i + 1) + '. ' + esc(s.en) + '</div>' +
                    (s.zh ? '<div class="rs-zh' + (readerState.showZh ? '' : ' hidden-zh') + '">' + esc(s.zh) + '</div>' : '');
                listEl.appendChild(div);
            });
            pop.style.display = 'flex';
            readerState.popupOpen = true;
            const tb = pop.querySelector('#readerTransBtn');
            if (tb) tb.style.background = readerState.showZh ? '' : 'rgba(255,255,255,0.5)';
        }

        // ---------- DOM 增強（在 bindEvents 之後執行） ----------
        // ==================== 改良 v18：段落句子化（懸浮中英高亮、點擊朗讀該句） ====================
        // 後備拆句：資料層無 sentences 時，把含 <br> 的詩歌/多句文本拆成逐句
        function fallbackSplit(text) {
            const t = stripHtml(String(text || '').replace(/<br\s*\/?>/gi, '. ')).replace(/\s+/g, ' ').trim();
            if (!t) return [];
            const parts = [];
            const ABBR = /(?:Mr|Mrs|Ms|Dr|St|Prof|Rev|etc|No|e\.g|i\.e)\.$/i;
            let last = 0;
            const re = /(?<=[.!?])\s+/g;
            let m;
            while ((m = re.exec(t)) !== null) {
                const before = t.slice(0, m.index);
                if (ABBR.test(before)) continue;
                parts.push(t.slice(last, m.index + 1));
                last = m.index + 1;
            }
            if (last < t.length) parts.push(t.slice(last));
            return parts.length ? parts : [t];
        }
        function sentencefy(root, lang, aprefix) {
            if (!root) return 0;
            const frag = document.createDocumentFragment();
            const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
            const nodes = [];
            while (walker.nextNode()) nodes.push(walker.currentNode);
            let sid = 0;
            let segEl = document.createElement('span');
            segEl.className = lang === 'zh' ? 'sentence-zh' : 'sentence';
            segEl.setAttribute('data-sentence-index', sid);
            if (lang !== 'zh') segEl.setAttribute('data-plain-text', '');
            if (aprefix && lang !== 'zh') segEl.setAttribute('data-audio', aprefix + '-s' + (sid + 1));
            frag.appendChild(segEl);
            function pushInto(sub, keyU) {
                let holder = segEl;
                if (keyU) {
                    holder = document.createElement('u');
                    holder.className = keyU.className;
                    if (keyU.getAttribute('data-pair')) holder.setAttribute('data-pair', keyU.getAttribute('data-pair'));
                    if (keyU.getAttribute('data-side')) holder.setAttribute('data-side', keyU.getAttribute('data-side'));
                    if (keyU.getAttribute('data-audio')) holder.setAttribute('data-audio', keyU.getAttribute('data-audio'));
                    segEl.appendChild(holder);
                }
                holder.appendChild(document.createTextNode(sub));
            }
            function nextSeg() {
                if (segEl.textContent.trim()) {
                    if (lang !== 'zh') segEl.setAttribute('data-plain-text', segEl.textContent.trim());
                    sid++;
                    const ns = document.createElement('span');
                    ns.className = lang === 'zh' ? 'sentence-zh' : 'sentence';
                    ns.setAttribute('data-sentence-index', sid);
                    if (lang !== 'zh') ns.setAttribute('data-plain-text', '');
                    if (aprefix && lang !== 'zh') ns.setAttribute('data-audio', aprefix + '-s' + (sid + 1));
                    frag.appendChild(ns);
                    segEl = ns;
                }
            }
            // 詩歌體（Rap 等含 <br>）：前一兄弟是 <br> 時視為新句
            function prevIsBr(tn) {
                let n = tn.previousSibling;
                while (n && n.nodeType === Node.TEXT_NODE && !n.nodeValue.trim()) n = n.previousSibling;
                return !!(n && n.nodeName === 'BR');
            }
            const poem = !!root.querySelector('br');
            const ABBR = /(?:Mr|Mrs|Ms|Dr|St|Prof|Rev|etc|No|e\.g|i\.e)\.$/i;
            nodes.forEach(function(tn) {
                if (poem && prevIsBr(tn)) nextSeg();
                const keyU = (tn.parentNode && tn.parentNode.classList && tn.parentNode.classList.contains('key-term')) ? tn.parentNode : null;
                const text = tn.nodeValue;
                const re = /(?<=[.!?])\s+/g;
                let last = 0, m;
                const cuts = [];
                while ((m = re.exec(text)) !== null) {
                    const before = text.slice(0, m.index);
                    if (ABBR.test(before)) continue;
                    cuts.push(m.index + 1);
                }
                cuts.forEach(function(cut) {
                    const sub = text.slice(last, cut);
                    pushInto(sub, keyU);
                    last = cut;
                    nextSeg();
                });
                if (last < text.length) pushInto(text.slice(last), keyU);
            });
            if (segEl && !segEl.textContent.trim()) {
                segEl.parentNode.removeChild(segEl);
                sid--;
            } else if (lang !== 'zh') {
                segEl.setAttribute('data-plain-text', segEl.textContent.trim());
            }
            root.innerHTML = '';
            root.appendChild(frag);
            return sid + 1;
        }

        function clearSentenceHover() {
            document.querySelectorAll('.sentence.sentence-hover, .sentence-zh.sentence-hover').forEach(function(x) { x.classList.remove('sentence-hover'); });
        }

        function sentenceContainer(el) {
            return el.closest('.example-pair') || el.closest('.paragraph-container') || el.closest('.song-container') || el.closest('.grammar-card') || el.closest('body');
        }

        function playKeyTermAudio(el) {
            stopCurrentAudio();
            const akey = el.getAttribute('data-audio');
            const text = el.textContent;
            if (!akey) { speakEnglish(text); return; }
            const candidates = ['audio/kt/' + akey + '.mp3', 'audio/kt/' + akey + '.wav'];
            let i = 0;
            const tryNext = function() {
                if (i >= candidates.length) { speakEnglish(text); return; }
                const a = new Audio(candidates[i]);
                i++;
                currentLocalAudio = a;
                a.addEventListener('error', function() { if (currentLocalAudio === a) currentLocalAudio = null; tryNext(); }, { once: true });
                a.addEventListener('canplaythrough', function() {
                    if (currentLocalAudio !== a) return;
                    a.play().catch(function() { if (currentLocalAudio === a) currentLocalAudio = null; tryNext(); });
                }, { once: true });
                a.load();
            };
            tryNext();
        }

        var currentParagraphSeq = null;

        function playParagraphSequence(btn, container) {
            const sents = Array.from(container.querySelectorAll('.sentence[data-sentence-index]'))
                .sort(function(a, b) { return (+a.getAttribute('data-sentence-index')) - (+b.getAttribute('data-sentence-index')); });
            if (!sents.length) return false;
            if (currentParagraphSeq) { stopCurrentAudio(); return true; }
            stopCurrentAudio();
            const seq = { btn: btn, sents: sents, i: 0 };
            currentParagraphSeq = seq;
            currentPlayButton = btn;
            btn.classList.add('playing');
            setPlayIcon(btn, 'stop');
            const next = function() {
                if (currentParagraphSeq !== seq) return;
                if (seq.i >= seq.sents.length) {
                    currentParagraphSeq = null;
                    if (currentPlayButton === btn) {
                        currentPlayButton = null;
                        btn.classList.remove('playing');
                        setPlayIcon(btn, 'play');
                    }
                    return;
                }
                playSentence(seq.sents[seq.i], next);
                seq.i++;
            };
            next();
            return true;
        }

        function playSentence(s, onEnd) {
            stopCurrentAudio(true);
            document.querySelectorAll('.sentence.sentence-playing, .sentence-zh.sentence-playing').forEach(function(x) { x.classList.remove('sentence-playing'); });
            const c = sentenceContainer(s);
            const idx = s.getAttribute('data-sentence-index');
            if (c && idx !== null) {
                c.querySelectorAll('.sentence[data-sentence-index="' + idx + '"], .sentence-zh[data-sentence-index="' + idx + '"]').forEach(function(x) { x.classList.add('sentence-playing'); });
            } else {
                s.classList.add('sentence-playing');
            }
            const text = s.getAttribute('data-plain-text') || s.textContent.trim();
            const done = function() {
                document.querySelectorAll('.sentence.sentence-playing, .sentence-zh.sentence-playing').forEach(function(x) { x.classList.remove('sentence-playing'); });
                if (typeof onEnd === 'function') onEnd();
            };
            const akey = s.getAttribute('data-audio');
            if (akey) {
                const abase = audioBase();
                const candidates = [abase + '/' + akey + '.mp3', abase + '/' + akey + '.wav'];
                let ai = 0;
                const tryNext = function() {
                    if (ai >= candidates.length) { speakEnglish(text, done); return; }
                    const a = new Audio(candidates[ai]);
                    ai++;
                    currentLocalAudio = a;
                    a.addEventListener('error', function() { if (currentLocalAudio === a) currentLocalAudio = null; tryNext(); }, { once: true });
                    a.addEventListener('canplaythrough', function() {
                        if (currentLocalAudio !== a) return;
                        a.addEventListener('ended', done, { once: true });
                        a.play().catch(function() { if (currentLocalAudio === a) currentLocalAudio = null; tryNext(); });
                    }, { once: true });
                    a.load();
                };
                tryNext();
            } else {
                speakEnglish(text, done);
            }
        }

        function bindSentenceInteractions() {
            if (window.__sentenceBound) return;
            window.__sentenceBound = true;
            document.addEventListener('mouseover', function(e) {
                // 懸浮底線詞（key-term）時：維持其黃色聯動，不觸發句子高亮
                if (e.target && e.target.closest && e.target.closest('.key-term')) {
                    clearSentenceHover();
                    return;
                }
                const s = e.target && e.target.closest ? e.target.closest('.sentence, .sentence-zh') : null;
                if (!s) return;
                clearSentenceHover();
                const c = sentenceContainer(s);
                const idx = s.getAttribute('data-sentence-index');
                if (c && idx !== null) {
                    c.querySelectorAll('.sentence[data-sentence-index="' + idx + '"], .sentence-zh[data-sentence-index="' + idx + '"]').forEach(function(x) { x.classList.add('sentence-hover'); });
                } else {
                    s.classList.add('sentence-hover');
                }
            });
            document.addEventListener('mouseout', function(e) {
                const s = e.target && e.target.closest ? e.target.closest('.sentence, .sentence-zh') : null;
                const rt = e.relatedTarget;
                if (s && rt && s.contains(rt)) return;
                clearSentenceHover();
            });
            // 點擊英文句：只朗讀該句（中英同時高亮）；中文句不可點擊朗讀
            document.addEventListener('click', function(e) {
                const s = e.target && e.target.closest ? e.target.closest('.sentence') : null;
                if (!s) return;
                e.stopPropagation();
                playSentence(s);
            });
        }

        function enhanceReadingDom() {
            // A. 題目解題直接顯示（CSS 已處理）；此處處理 Text Type 與聆聽
            // B. Text Type：音樂播放按鈕（音符/唱片）＋中文翻譯
            const ttSection = document.getElementById('textTypeSection');
            if (ttSection && LESSON.textType && LESSON.textType.model) {
                const tt = LESSON.textType;
                const header = ttSection.querySelector('.song-header');
                const bodyBox = ttSection.querySelector('.song-container > div:last-child');
                if (header) {
                    const mbtn = document.createElement('button');
                    mbtn.className = 'music-play-btn';
                    mbtn.innerHTML = '<i class="fas fa-music icon-note"></i><i class="fas fa-compact-disc icon-disc"></i>';
                    mbtn.setAttribute('aria-label', '播放' + (tt.title || '文本'));
                    header.appendChild(mbtn);
                    mbtn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        if (this.classList.contains('playing')) { stopCurrentAudio(); return; }
                        const container = this.closest('.song-container');
                        if (container && playParagraphSequence(this, container)) return;
                        this.classList.add('playing');
                        playLocalOrTts('', stripHtml(tt.model.body || ''), this);
                    });
                }
                if (bodyBox && tt.model.zh && !ttSection.querySelector('.song-container .translation')) {
                    const zhDiv = document.createElement('div');
                    zhDiv.className = 'translation show';
                    zhDiv.innerHTML = markZhPairs(tt.model.zh, tt.model.pairs || [], false, 'tt');
                    bodyBox.parentNode.insertBefore(zhDiv, bodyBox.nextSibling);
                }
            }
            // C. 聆聽：波浪＋「廣播稿」按鈕＋重綁播放按鈕（clone 移除舊監聽）
            const listenBtn = document.querySelector('.listening-play-btn');
            if (listenBtn) {
                const holder = listenBtn.parentNode;
                const wave = document.createElement('span');
                wave.className = 'wave-bars paused';
                wave.id = 'listeningWave';
                wave.innerHTML = '<span></span><span></span><span></span><span></span><span></span>';
                holder.appendChild(wave);
                const rbtn = document.createElement('button');
                rbtn.className = 'btn btn-check';
                rbtn.id = 'openReaderBtn';
                rbtn.innerHTML = '<i class="fas fa-scroll"></i>';
                rbtn.title = '廣播稿（中英對照）';
                rbtn.setAttribute('aria-label', '打開聆聽廣播稿');
                holder.appendChild(rbtn);
                rbtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    openListeningReader();
                });
                const clone = listenBtn.cloneNode(true);
                clone.innerHTML = '<i class="fas fa-play"></i>';
                clone.title = '播放聆聽音頻';
                holder.replaceChild(clone, listenBtn);
                clone.addEventListener('click', function(e) {
                    e.stopPropagation();
                    listeningPlayToggle();
                });
            }
            // D. 句子互動：課文/textType 已由渲染層逐句輸出；文法例句自動拆句
            bindSentenceInteractions();
            document.querySelectorAll('.grammar-card').forEach(function(card, gi) {
                card.querySelectorAll('.example-english').forEach(function(p, ei) {
                    sentencefy(p, 'en', 'g' + (gi + 1) + '-e' + (ei + 1));
                });
                card.querySelectorAll('.example-chinese').forEach(function(p, ei) {
                    sentencefy(p, 'zh');
                });
            });
        }

        // ==================== 改良 v12：覆寫 initApp（加入 DOM 增強） ====================
        async function initApp() {
            const unitFile = getRequestedUnitFile();
            let data;
            try {
                const res = await fetch(unitFile, { cache: 'no-cache' });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                data = await res.json();
            } catch (err) {
                document.getElementById('loadError').style.display = 'block';
                console.error('無法載入 ' + unitFile + ':', err);
                return;
            }

            LESSON = data;

            const sel = document.getElementById('unitSelect');
            if (sel) sel.value = unitFile;

            applyMeta();
            renderFlashcards();
            renderReading();
            renderPractice();
            renderQuiz();
            renderLearningTab();
            enhanceExpl();
            populateAnswers();
            bindEvents();
            enhanceReadingDom();
            showPage(1);
        }
</script>
